<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BREWINGTON YARD // GOD VIEW</title>
<link rel="icon" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='8' fill='%2306060a'/><circle cx='32' cy='32' r='10' fill='none' stroke='%2300e5ff' stroke-width='3'/><circle cx='32' cy='32' r='2' fill='%2300e5ff'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@300;400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#06060a;
  --cyan:#00e5ff;
  --cyan-dim:rgba(0,229,255,.55);
  --warm:#f2f0ed;
  --warm-glow:#ffd079;
  --muted:#6b6f7a;
  --muted-2:#4a4e58;
  --danger:#ff5a5f;
  --success:#3dd68c;
  --amber:#ffb347;
  --purple:#d9a6ff;
  --wood:#a68550;
  --wood-dark:#6e5630;
  --f-display:'Syne',sans-serif;
  --f-body:'DM Sans',sans-serif;
  --f-mono:'JetBrains Mono',ui-monospace,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:#06060a;color:var(--warm);font-family:var(--f-body);overflow:hidden;-webkit-font-smoothing:antialiased}
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:500;background:repeating-linear-gradient(180deg,rgba(0,0,0,0) 0 3px,rgba(0,0,0,.08) 3px 4px);mix-blend-mode:multiply;opacity:.4}

.shell{position:relative;z-index:1;height:100vh;width:100vw;display:grid;grid-template-rows:56px 32px 1fr;grid-template-columns:1fr 320px;grid-template-areas:"bar bar" "ticker ticker" "map ledger"}

.bar{grid-area:bar;display:flex;align-items:center;padding:0 18px;border-bottom:1px solid rgba(30,33,48,.7);background:rgba(8,9,15,.72);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);gap:14px;z-index:10}
.brand{display:flex;align-items:center;gap:10px}
.mark{width:28px;height:28px;border-radius:4px;background:#10121c;border:1px solid #272b3c;display:grid;place-items:center;color:var(--cyan);font-family:var(--f-mono);font-size:13px;font-weight:600}
.brand-h{font-family:var(--f-display);font-weight:800;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--warm)}
.brand-s{font-family:var(--f-mono);font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.brand-s .owner{color:var(--cyan)}

.stats{margin-left:auto;display:flex;gap:14px;align-items:center}
.kv{display:flex;flex-direction:column;gap:1px;align-items:flex-end}
.kv .k{font-family:var(--f-mono);font-size:8.5px;color:var(--muted);letter-spacing:.14em;text-transform:uppercase}
.kv .v{font-family:var(--f-mono);font-size:13px;font-weight:500;color:var(--warm)}
.kv .v.pos{color:var(--success)}.kv .v.neg{color:var(--danger)}.kv .v.warn{color:var(--amber)}.kv .v.cyan{color:var(--cyan)}

.clock{font-family:var(--f-mono);font-size:14px;color:var(--warm);letter-spacing:.08em;padding-left:4px}
.dusk{font-family:var(--f-mono);font-size:9px;color:var(--amber);letter-spacing:.16em;text-transform:uppercase;padding-left:10px;border-left:1px solid rgba(30,33,48,.7);height:22px;display:flex;align-items:center}
.lamp-wrap{display:flex;align-items:center;gap:6px;padding-left:10px;border-left:1px solid rgba(30,33,48,.7);height:22px}
.lamp{width:7px;height:7px;border-radius:50%;background:var(--muted-2)}
.lamp.on{background:var(--success);box-shadow:0 0 10px rgba(61,214,140,.7);animation:breathe 3s ease-in-out infinite}
.lamp.off{background:var(--danger)}
.lamp-lbl{font-family:var(--f-mono);font-size:9px;letter-spacing:.14em;color:var(--muted)}
@keyframes breathe{0%,100%{opacity:1}50%{opacity:.45}}

.map{grid-area:map;position:relative;overflow:hidden;background:#06060a}
.map svg{display:block;width:100%;height:100%}

@keyframes pulseRing{0%{r:20;opacity:.7}100%{r:170;opacity:0}}
@keyframes flicker{0%,100%{opacity:.95}40%{opacity:.78}55%{opacity:1}80%{opacity:.88}}
@keyframes smokeRise{0%{transform:translate(0,0) scale(1);opacity:.55}100%{transform:translate(12px,-60px) scale(2.2);opacity:0}}
@keyframes lampBreathe{0%,100%{opacity:.85}50%{opacity:.55}}
@keyframes beacon{0%,84%,100%{opacity:1}88%{opacity:.2}94%{opacity:1}}
@keyframes signSway{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(2deg)}}
@keyframes spark{0%{transform:translate(0,0);opacity:1}100%{transform:translate(18px,20px);opacity:0}}
@keyframes dustDrift{from{transform:translate(-40px,-20px)}to{transform:translate(1640px,1020px)}}
@keyframes windowFlicker{0%,100%{opacity:.95}33%{opacity:.82}67%{opacity:1}}
@keyframes grassWave{0%,100%{transform:skewX(-3deg)}50%{transform:skewX(3deg)}}
@keyframes truckLoop{0%{offset-distance:0%}100%{offset-distance:100%}}
@keyframes twinkle{0%,100%{opacity:.3}50%{opacity:1}}
@keyframes tailWag{0%,100%{transform:translateX(-1px) rotate(-12deg)}50%{transform:translateX(1px) rotate(12deg)}}
@keyframes catBlink{0%,92%,100%{transform:scaleY(1)}95%,97%{transform:scaleY(.05)}}
@keyframes confettiFall{0%{transform:translate(0,0) rotate(0);opacity:1}100%{transform:translate(var(--cx,0),var(--cy,80px)) rotate(360deg);opacity:0}}
@keyframes walkBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-1px)}}
@keyframes modeDot{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.5;transform:scale(1.3)}}
@keyframes commuteDash{to{stroke-dashoffset:-40}}
@keyframes tumble{0%{transform:translate(-60px,540px) rotate(0)}100%{transform:translate(1660px,540px) rotate(1800deg)}}
@keyframes raccoonRun{0%{transform:translate(-40px,760px)}100%{transform:translate(1660px,760px)}}

.smoke-puff{transform-origin:center;animation:smokeRise 4.5s ease-out infinite}
.smoke-puff.d1{animation-delay:1.5s}
.smoke-puff.d2{animation-delay:3s}
.lamp-halo{animation:lampBreathe 4s ease-in-out infinite}
.beacon-light{animation:beacon 6s linear infinite;transform-origin:center}
.open-sign{transform-origin:top center;animation:signSway 5s ease-in-out infinite}
.hanging-sign{transform-origin:top center;animation:signSway 7s ease-in-out infinite}
.window-lit{animation:windowFlicker 5s ease-in-out infinite}
.grass{transform-origin:bottom center;animation:grassWave 6s ease-in-out infinite}
.dust-mote{animation:dustDrift 60s linear infinite}
.spark-dot{transform-origin:center;animation:spark 1.2s ease-out infinite}
.mail-truck{offset-path:path('M 420 340 Q 420 260 500 260 L 1100 260 Q 1180 260 1180 340 L 1180 680 Q 1180 760 1100 760 L 500 760 Q 420 760 420 680 Z');offset-rotate:auto;animation:truckLoop 42s linear infinite}
.twinkle{animation:twinkle 3s ease-in-out infinite}
.dog-tail{transform-origin:right center;animation:tailWag .8s ease-in-out infinite}
.cat-eye{transform-origin:center;animation:catBlink 8s ease-in-out infinite}
.walker{animation:walkBob .4s ease-in-out infinite}
.commute-line{stroke-dasharray:6 6;animation:commuteDash 1.2s linear infinite}
.tumbleweed{animation:tumble 90s linear infinite}
.raccoon{animation:raccoonRun 28s linear infinite}
.confetti-bit{animation:confettiFall 1.8s ease-out forwards}

/* --- right ledger panel --- */
.ledger{grid-area:ledger;border-left:1px solid rgba(30,33,48,.7);background:linear-gradient(180deg,rgba(8,9,15,.88),rgba(6,6,10,.94));backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);display:flex;flex-direction:column;overflow:hidden}
.ledger-head{padding:14px 18px 10px;border-bottom:1px solid rgba(30,33,48,.55)}
.ledger-title{font-family:var(--f-display);font-weight:800;font-size:11px;letter-spacing:.28em;text-transform:uppercase;color:var(--warm)}
.ledger-sub{font-family:var(--f-mono);font-size:9px;color:var(--muted);letter-spacing:.12em;margin-top:3px}
.tenant-rows{list-style:none;overflow-y:auto;flex:1;min-height:0;padding:4px 0}
.tenant-rows::-webkit-scrollbar{width:4px}
.tenant-rows::-webkit-scrollbar-thumb{background:#272b3c;border-radius:2px}
.tenant-row{padding:11px 16px;border-bottom:1px solid rgba(30,33,48,.35);display:flex;flex-direction:column;gap:5px;transition:background .2s}
.tenant-row:hover{background:rgba(0,229,255,.03)}
.row-head{display:flex;align-items:center;gap:8px}
.row-name{font-family:var(--f-display);font-weight:800;font-size:13px;letter-spacing:.1em;color:var(--warm);flex:0 0 auto}
.row-role{font-family:var(--f-mono);font-size:8.5px;letter-spacing:.16em;color:var(--muted);text-transform:uppercase;flex:1}
.row-mode-dot{width:7px;height:7px;border-radius:50%;background:var(--muted-2)}
.row-mode-dot.active{background:var(--cyan);box-shadow:0 0 8px rgba(0,229,255,.6);animation:modeDot 2.2s ease-in-out infinite}
.row-money{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.money-earned{font-family:var(--f-mono);font-size:18px;font-weight:500;color:var(--cyan);letter-spacing:.02em}
.money-rent{font-family:var(--f-mono);font-size:9px;color:var(--muted);letter-spacing:.1em}
.money-net{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.08em;margin-left:auto;font-weight:500}
.money-net.pos{color:var(--success)}
.money-net.neg{color:var(--danger)}
.row-job{font-family:var(--f-body);font-size:10.5px;color:rgba(242,240,237,.72);line-height:1.35}
.row-contrib{display:flex;flex-direction:column;gap:3px;margin-top:2px}
.contrib-bar{height:4px;background:rgba(30,33,48,.6);border-radius:2px;overflow:hidden}
.contrib-fill{height:100%;background:linear-gradient(90deg,var(--cyan),var(--amber));border-radius:2px;transition:width .6s ease}
.contrib-label{font-family:var(--f-mono);font-size:8.5px;color:var(--muted-2);letter-spacing:.1em}
.ledger-foot{padding:10px 16px;border-top:1px solid rgba(30,33,48,.55);display:flex;justify-content:space-between;align-items:center;font-family:var(--f-mono);font-size:10px;color:var(--muted);letter-spacing:.14em}
.ledger-foot strong{color:var(--success);font-weight:500}
.ledger-foot strong.neg{color:var(--danger)}

@media (max-width:1000px){
  .shell{grid-template-columns:1fr;grid-template-rows:56px 32px 1fr 320px;grid-template-areas:"bar" "ticker" "map" "ledger"}
  .ledger{border-left:none;border-top:1px solid rgba(30,33,48,.7)}
}

/* --- alerts pill + modal --- */
.alerts{display:flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;cursor:pointer;user-select:none;background:rgba(30,33,48,.55);border:1px solid rgba(30,33,48,.9);transition:background .2s,border-color .2s,transform .15s;margin-left:6px}
.alerts:hover{transform:translateY(-1px)}
.alerts.hot{background:rgba(255,90,95,.18);border-color:rgba(255,90,95,.8);animation:alertBreathe 2s ease-in-out infinite}
.alerts-dot{width:7px;height:7px;border-radius:50%;background:var(--muted-2);box-shadow:none}
.alerts.hot .alerts-dot{background:var(--danger);box-shadow:0 0 8px rgba(255,90,95,.8)}
.alerts-n{font-family:var(--f-mono);font-size:12px;font-weight:500;color:var(--muted);letter-spacing:.04em;min-width:12px;text-align:center}
.alerts.hot .alerts-n{color:#fff}
.alerts-lbl{font-family:var(--f-mono);font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.alerts.hot .alerts-lbl{color:#ffb8ba}
@keyframes alertBreathe{0%,100%{box-shadow:0 0 0 0 rgba(255,90,95,.35)}50%{box-shadow:0 0 0 6px rgba(255,90,95,0)}}

.alert-dlg{position:fixed;top:72px;right:18px;z-index:200;width:360px;max-height:70vh;overflow:hidden;background:rgba(8,9,15,.96);border:1px solid rgba(0,229,255,.35);border-radius:6px;box-shadow:0 20px 60px rgba(0,0,0,.6),0 0 0 1px rgba(0,0,0,.4);display:none;flex-direction:column}
.alert-dlg.open{display:flex}
.alert-dlg-h{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border-bottom:1px solid rgba(30,33,48,.7)}
.alert-dlg-t{font-family:var(--f-display);font-weight:800;font-size:11px;letter-spacing:.26em;color:var(--warm);text-transform:uppercase}
.alert-dlg-x{cursor:pointer;font-family:var(--f-mono);font-size:14px;color:var(--muted);padding:2px 6px;border-radius:3px;transition:color .15s,background .15s}
.alert-dlg-x:hover{color:var(--warm);background:rgba(30,33,48,.6)}
.alert-dlg-list{list-style:none;overflow-y:auto;padding:4px 0;flex:1;min-height:0}
.alert-dlg-list::-webkit-scrollbar{width:4px}
.alert-dlg-list::-webkit-scrollbar-thumb{background:#272b3c;border-radius:2px}
.alert-item{padding:10px 14px;border-bottom:1px solid rgba(30,33,48,.4);display:flex;flex-direction:column;gap:3px}
.alert-item-h{display:flex;align-items:baseline;gap:8px}
.alert-item-sub{font-family:var(--f-display);font-weight:800;font-size:12px;letter-spacing:.1em;color:var(--warm);text-transform:uppercase}
.alert-item-type{font-family:var(--f-mono);font-size:8.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--danger);margin-left:auto}
.alert-item-reason{font-family:var(--f-body);font-size:10.5px;color:rgba(242,240,237,.72);line-height:1.35}
.alert-item-age{font-family:var(--f-mono);font-size:8.5px;color:var(--muted);letter-spacing:.12em}
.alert-dlg-empty{padding:32px 16px;text-align:center;font-family:var(--f-mono);font-size:10.5px;color:var(--muted);letter-spacing:.12em}

/* --- wins ticker strip --- */
.ticker{grid-area:ticker;position:relative;overflow:hidden;background:rgba(8,9,15,.82);border-bottom:1px solid rgba(30,33,48,.55);display:flex;align-items:center}
.ticker-label{flex:0 0 auto;padding:0 14px 0 16px;font-family:var(--f-mono);font-size:9px;letter-spacing:.2em;color:var(--cyan);text-transform:uppercase;border-right:1px solid rgba(30,33,48,.55);height:100%;display:flex;align-items:center;background:rgba(0,229,255,.04);z-index:2}
.ticker-wrap{flex:1;overflow:hidden;position:relative;height:100%;mask-image:linear-gradient(90deg,transparent 0,#000 40px,#000 calc(100% - 40px),transparent 100%);-webkit-mask-image:linear-gradient(90deg,transparent 0,#000 40px,#000 calc(100% - 40px),transparent 100%)}
.ticker-strip{display:inline-flex;align-items:center;gap:28px;height:100%;white-space:nowrap;padding-left:20px;animation:tickerRoll 40s linear infinite;will-change:transform}
.ticker-strip.paused{animation-play-state:paused}
.ticker-wrap:hover .ticker-strip{animation-play-state:paused}
@keyframes tickerRoll{from{transform:translateX(0)}to{transform:translateX(-50%)}}
.win{display:inline-flex;align-items:center;gap:8px;font-family:var(--f-mono);font-size:10.5px;color:var(--warm);letter-spacing:.04em}
.win-dot{width:6px;height:6px;border-radius:50%;flex:0 0 auto}
.win-txt{color:var(--warm)}
.win-age{color:var(--muted);font-size:9.5px;letter-spacing:.1em;margin-left:4px}
.ticker-empty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:var(--f-mono);font-size:10px;color:var(--muted-2);letter-spacing:.18em;text-transform:uppercase;pointer-events:none}
</style>
</head>
<body>

<div class="shell">

  <!-- TOP BAR -->
  <header class="bar">
    <div class="brand">
      <div class="mark">B</div>
      <div>
        <div class="brand-h">Brewington Yard // God View</div>
        <div class="brand-s"><span class="owner">Lando Brewington</span> // Landlord</div>
      </div>
    </div>
    <div class="stats">
      <div class="kv"><div class="k">Occupancy</div><div class="v cyan" id="kv-occ">0%</div></div>
      <div class="kv"><div class="k">Rent Owed</div><div class="v warn" id="kv-owed">$0</div></div>
      <div class="kv"><div class="k">Rent Paid</div><div class="v pos" id="kv-paid">$0</div></div>
      <div class="kv"><div class="k">Behind</div><div class="v neg" id="kv-behind">0</div></div>
      <div class="kv"><div class="k">Vacant</div><div class="v" id="kv-vacant">0</div></div>
      <div class="kv"><div class="k">Apps</div><div class="v" id="kv-apps">0</div></div>
      <div class="alerts" id="alerts" onclick="toggleAlerts(event)" title="Things waiting on Lando">
        <span class="alerts-dot"></span>
        <span class="alerts-n" id="alerts-n">0</span>
        <span class="alerts-lbl">Alerts</span>
      </div>
      <div class="clock" id="clock">--:--:--</div>
      <div class="dusk" id="dusk">DUSK</div>
      <div class="lamp-wrap"><div class="lamp" id="lamp"></div><div class="lamp-lbl" id="lamp-lbl">...</div></div>
    </div>
  </header>

  <!-- WINS TICKER -->
  <div class="ticker" id="wins-ticker">
    <div class="ticker-label">WINS</div>
    <div class="ticker-wrap" id="wins-wrap">
      <div class="ticker-strip" id="wins-strip"></div>
    </div>
  </div>

  <!-- ALERT DIALOG (floating panel) -->
  <div class="alert-dlg" id="alert-dlg" role="dialog" aria-label="Alerts">
    <div class="alert-dlg-h">
      <div class="alert-dlg-t">Needs Lando</div>
      <div class="alert-dlg-x" onclick="closeAlerts()" aria-label="Close">CLOSE</div>
    </div>
    <ul class="alert-dlg-list" id="alert-dlg-list"></ul>
  </div>

  <!-- MAP (the yard) -->
  <section class="map">
    <svg viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid meet" id="svg">
      <defs>
        <!-- time-of-day sky gradients (JS picks one) -->
        <radialGradient id="sky-night" cx="50%" cy="40%" r="75%">
          <stop offset="0%"  stop-color="#0b1020"/>
          <stop offset="55%" stop-color="#05070f"/>
          <stop offset="100%" stop-color="#03040a"/>
        </radialGradient>
        <radialGradient id="sky-dawn" cx="50%" cy="70%" r="85%">
          <stop offset="0%"  stop-color="#ff9a7a"/>
          <stop offset="35%" stop-color="#c96a70"/>
          <stop offset="70%" stop-color="#3a3560"/>
          <stop offset="100%" stop-color="#141830"/>
        </radialGradient>
        <radialGradient id="sky-morning" cx="50%" cy="60%" r="80%">
          <stop offset="0%"  stop-color="#c9e2f0"/>
          <stop offset="50%" stop-color="#89b0c8"/>
          <stop offset="100%" stop-color="#3d5268"/>
        </radialGradient>
        <radialGradient id="sky-midday" cx="50%" cy="55%" r="80%">
          <stop offset="0%"  stop-color="#7cc4e8"/>
          <stop offset="60%" stop-color="#4a8ec0"/>
          <stop offset="100%" stop-color="#1f3a5a"/>
        </radialGradient>
        <radialGradient id="sky-golden" cx="30%" cy="70%" r="90%">
          <stop offset="0%"  stop-color="#ffb36b"/>
          <stop offset="45%" stop-color="#cc6a55"/>
          <stop offset="100%" stop-color="#2a2040"/>
        </radialGradient>
        <radialGradient id="sky-dusk" cx="50%" cy="40%" r="70%">
          <stop offset="0%"  stop-color="#141826"/>
          <stop offset="55%" stop-color="#0a0c14"/>
          <stop offset="100%" stop-color="#05060a"/>
        </radialGradient>
        <radialGradient id="sky-blue" cx="50%" cy="45%" r="75%">
          <stop offset="0%"  stop-color="#1a2450"/>
          <stop offset="55%" stop-color="#0c1028"/>
          <stop offset="100%" stop-color="#04060e"/>
        </radialGradient>
        <!-- west warm glow overlay -->
        <linearGradient id="duskLight" x1="0%" y1="50%" x2="100%" y2="50%">
          <stop offset="0%" stop-color="#3a1f1a" stop-opacity=".35"/>
          <stop offset="35%" stop-color="#3a1f1a" stop-opacity=".12"/>
          <stop offset="65%" stop-color="#0e1220" stop-opacity="0"/>
          <stop offset="100%" stop-color="#0e1220" stop-opacity=".25"/>
        </linearGradient>
        <pattern id="groundDots" x="0" y="0" width="14" height="14" patternUnits="userSpaceOnUse">
          <rect width="14" height="14" fill="#141826"/>
          <circle cx="3" cy="4" r=".6" fill="rgba(255,255,255,.025)"/>
          <circle cx="10" cy="10" r=".5" fill="rgba(255,255,255,.02)"/>
          <circle cx="7" cy="1" r=".4" fill="rgba(255,255,255,.02)"/>
        </pattern>
        <pattern id="gravel" x="0" y="0" width="10" height="10" patternUnits="userSpaceOnUse">
          <rect width="10" height="10" fill="#1c2030"/>
          <circle cx="2" cy="3" r=".5" fill="rgba(255,255,255,.05)"/>
          <circle cx="7" cy="7" r=".6" fill="rgba(255,255,255,.04)"/>
          <circle cx="5" cy="1" r=".4" fill="rgba(0,0,0,.3)"/>
        </pattern>
        <filter id="windowGlow" x="-50%" y="-50%" width="200%" height="200%">
          <feGaussianBlur stdDeviation="3" result="b"/>
          <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
        <radialGradient id="lampGlow" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#ffb347" stop-opacity=".55"/>
          <stop offset="60%" stop-color="#ff9040" stop-opacity=".18"/>
          <stop offset="100%" stop-color="#ff9040" stop-opacity="0"/>
        </radialGradient>
        <radialGradient id="smokeGrad">

/* ----------------- Hour + time-of-day ----------------- */
function currentHour(){ return new Date().getHours(); }
function phaseOf(h){
  if (h >= 5 && h < 7)   return 'dawn';
  if (h >= 7 && h < 10)  return 'morning';
  if (h >= 10 && h < 16) return 'midday';
  if (h >= 16 && h < 19) return 'golden';
  if (h >= 19 && h < 20) return 'dusk';
  if (h >= 20 && h < 22) return 'blue';
  return 'night';
}
function skyFillFor(phase){
  return 'url(#sky-' + ({dawn:'dawn',morning:'morning',midday:'midday',golden:'golden',dusk:'dusk',blue:'blue',night:'night'}[phase]) + ')';
}

}

function buildingFor(name, b){
  if (name === 'foreman')   return bldgForeman(b);
  if (name === 'scout')     return bldgScout(b);
  if (name === 'builder')   return bldgBuilder(b);
  if (name === 'paymaster') return bldgPaymaster(b);
  if (name === 'realtor')   return bldgRealtor(b);
  return S('g');
}

/* ----------------- Per-tenant character details ---------------- */
function tenantFlourish(name, h, b){
  const g = S('g');
  // Mailbox position (road-side) per plot
  // Determine mail flag: up if an untriaged application exists OR truck passed recently
  const appsUntriaged = (STATE.re.applications || []).filter(a => !a.triaged).length;
  const truckPassed = (Date.now() - (STATE._lastTruckPass || 0)) < 5000;
  const flagUp = appsUntriaged > 0 || truckPassed;

  if (name === 'foreman'){
    // Pickup parked on near road side
    const veh = vehicle(STATE.carsBought.foreman ? '#d4b060' : VEHICLE_COLOR.foreman, 'pickup');
    veh.setAttribute('transform', 'translate(-110,60)');
    g.appendChild(veh);
    if (STATE.carsBought.foreman){
      const st = starIcon(); st.setAttribute('transform', 'translate(-110,46)'); g.appendChild(st);
    }
    // Dog by doorway (8-18) with wagging tail
    if (h >= 8 && h < 18){
      const dog = S('g', {transform:'translate(50,50)'});
      dog.appendChild(S('rect', {x:-4, y:-2, width:8, height:5, rx:1.5, fill:'#8a6f3a'}));
      dog.appendChild(S('circle', {cx:-5, cy:-1, r:2, fill:'#8a6f3a'}));
      const tail = S('rect', {x:3, y:-1, width:4, height:1.2, fill:'#8a6f3a', class:'dog-tail'});
      dog.appendChild(tail);
      g.appendChild(dog);
    }
    // Mailbox at road edge
    const mb = mailbox(flagUp); mb.setAttribute('transform', 'translate(-90,90)'); g.appendChild(mb);
    // Humans by hour: dawn on steps w/ coffee, afternoon customer, dusk smoking on bench, morning silhouette in door
    if (h >= 6 && h < 8){ const p = human('#c13b22', false); p.setAttribute('transform','translate(28,45)'); g.appendChild(p); }
    else if (h >= 14 && h < 18){ const c = human('#d9a6ff', false); c.setAttribute('transform','translate(-40,55)'); g.appendChild(c); }
    else if (h >= 18 && h < 20){ const b2 = human('#c13b22', false); b2.setAttribute('transform','translate(72,38)'); g.appendChild(b2); }
  }

  if (name === 'scout'){
    // Bike rack already included; add customer at storefront in afternoon
    const veh = vehicle(STATE.carsBought.scout ? '#00e5ff' : VEHICLE_COLOR.scout, 'sedan');
    veh.setAttribute('transform', 'translate(-110,60)');
    g.appendChild(veh);
    if (STATE.carsBought.scout){
      const st = starIcon(); st.setAttribute('transform', 'translate(-110,46)'); g.appendChild(st);
    }
    const mb = mailbox(flagUp); mb.setAttribute('transform', 'translate(-90,90)'); g.appendChild(mb);

/* ----------------- Time-of-day sky, stars, sun, commute, traffic ---------------- */
function renderSky(){
  const h = currentHour();
  const phase = phaseOf(h);
  const sky = document.getElementById('sky-rect');
  if (sky) sky.setAttribute('fill', skyFillFor(phase));
  const duskOv = document.getElementById('dusk-overlay');
  if (duskOv) duskOv.setAttribute('opacity', (phase === 'golden' || phase === 'dusk') ? 1 : .25);

  // Stars + moon at night (20-22 blue, 22-05 night)
  const stars = document.getElementById('stars');
  stars.innerHTML = '';
  if (phase === 'night' || phase === 'blue'){
    const seed = 42;
    for (let i = 0; i < 14; i++){
      const x = ((seed * (i+1) * 37) % 1500) + 40;
      const y = ((seed * (i+3) * 19) % 240) + 20;
      const st = S('circle', {cx:x, cy:y, r: .8 + (i%3)*.3, fill:'#f2f0ed', class:'twinkle', opacity:.7});
      st.style.animationDelay = (i * .3) + 's';
      stars.appendChild(st);
    }
    // Crescent moon
    const moon = S('g', {transform:'translate(1380,120)'});
    moon.appendChild(S('circle', {r:22, fill:'#f2f0ed', opacity:.92}));
    moon.appendChild(S('circle', {cx:8, cy:-3, r:20, fill: phase === 'night' ? '#03040a' : '#0c1028'}));
    stars.appendChild(moon);
  }

  // Sun in day
  const sun = document.getElementById('sun');
  sun.innerHTML = '';
  if (phase === 'morning' || phase === 'midday' || phase === 'golden'){
    const sx = phase === 'morning' ? 260 : phase === 'midday' ? 800 : 1340;
    const sy = phase === 'midday' ? 90 : 140;
    const scolor = phase === 'golden' ? '#ff9a5a' : '#ffd079';
    sun.appendChild(S('circle', {cx:sx, cy:sy, r:38, fill:scolor, opacity:.35}));
    sun.appendChild(S('circle', {cx:sx, cy:sy, r:22, fill:scolor, opacity:.85}));
  }
}

/* ----------------- v4: Alerts ---------------- */
function ageStr(ts){
  if (!ts) return '';
  const ms = Date.now() - (typeof ts === 'number' ? ts : new Date(ts).getTime());
  if (isNaN(ms) || ms < 0) return 'just now';
  const s = Math.floor(ms/1000);
  if (s < 60) return s + 's ago';
  const m = Math.floor(s/60);
  if (m < 60) return m + 'm ago';
  const h = Math.floor(m/60);
  if (h < 48) return h + 'h ago';
  const d = Math.floor(h/24);
  return d + 'd ago';
}

function daysUntil(iso){
  if (!iso) return null;
  const t = new Date(iso).getTime();
  if (isNaN(t)) return null;
  return Math.ceil((t - Date.now()) / 86400000);
}

function computeAlerts(){
  const out = [];
  // 1. Untriaged applications
  (STATE.re.applications || []).forEach(a => {
    if (!a.triaged){
      out.push({
        type: 'APPLICATION',
        subject: a.title || a.slug || a.filename || 'new application',
        reason: 'Waiting for triage decision',
        age: a.received_at || a.created_at || null
      });
    }
  });
  // 2. Bays awaiting Lando reply > 48h
  // 3. Bays with failures_in_row > 0
  (STATE.state.businesses || []).forEach(b => {
    const agent = (FIRST[b.name] || (b.name || '').toUpperCase());
    if (b.status === 'awaiting_lando_reply' && b.last_escalation_at){
      const hrs = (Date.now() - new Date(b.last_escalation_at).getTime()) / 3600000;
      if (hrs > 48){
        out.push({
          type: 'ESCALATION',
          subject: agent,
          reason: 'Awaiting Lando reply, no move in ' + Math.floor(hrs) + 'h',
          age: b.last_escalation_at
        });
      }
    }
    if ((b.failures_in_row || 0) > 0){
      out.push({
        type: 'FAILURES',
        subject: agent,
        reason: b.failures_in_row + ' tick(s) failed in a row',
        age: b.last_tick_at || null
      });
    }
  });
  // 4. Rent default tenants
  // 5. d30 checkpoint within 3 days and not current
  const roll = (STATE.re.rent_roll && STATE.re.rent_roll.tenants) || [];
  roll.forEach(t => {
    const agent = (FIRST[t.tenant] || (t.tenant || '').toUpperCase());
    if (t.status === 'default'){
      out.push({
        type: 'RENT DEFAULT',
        subject: agent,
        reason: 'Rent in default ($' + (t.rent_mo || 0) + '/mo)',
        age: t.last_change_at || null
      });
    }
    if (t.d30_checkpoint){
      const d = daysUntil(t.d30_checkpoint);
      if (d !== null && d <= 3 && t.status !== 'current'){
        const label = d < 0 ? 'Eviction clock expired' : (d === 0 ? 'd30 checkpoint today' : d + 'd to d30 checkpoint');
        out.push({
          type: 'KILL CLOCK',
          subject: agent,
          reason: label + ' (status ' + (t.status || 'unknown') + ')',
          age: t.d30_checkpoint
        });
      }
    }
  });
  STATE.alerts = out;
  return out;
}

function renderAlertsPill(){
  const n = STATE.alerts.length;
  const pill = document.getElementById('alerts');
  const num = document.getElementById('alerts-n');
  if (!pill || !num) return;
  num.textContent = String(n);
  pill.classList.toggle('hot', n > 0);
  pill.setAttribute('aria-label', n + ' alerts waiting on Lando');
}

function renderAlertsDialog(){
  const list = document.getElementById('alert-dlg-list');
  if (!list) return;
  list.innerHTML = '';
  if (!STATE.alerts.length){
    const empty = H('li', {class:'alert-dlg-empty'}, 'All clear. Nothing waiting on you.');
    list.appendChild(empty);
    return;
  }
  STATE.alerts.forEach(a => {
    const li = H('li', {class:'alert-item'});
    const head = H('div', {class:'alert-item-h'});
    head.appendChild(H('div', {class:'alert-item-sub'}, a.subject));
    head.appendChild(H('div', {class:'alert-item-type'}, a.type));
    li.appendChild(head);
    li.appendChild(H('div', {class:'alert-item-reason'}, a.reason));
    if (a.age){
      li.appendChild(H('div', {class:'alert-item-age'}, ageStr(a.age)));
    }
    list.appendChild(li);
  });
}

function toggleAlerts(ev){
  if (ev) ev.stopPropagation();
  const dlg = document.getElementById('alert-dlg');
  if (!dlg) return;
  if (dlg.classList.contains('open')) closeAlerts();
  else openAlerts();
}
function openAlerts(){
  const dlg = document.getElementById('alert-dlg');
  if (!dlg) return;
  renderAlertsDialog();
  dlg.classList.add('open');
  document.addEventListener('click', outsideAlerts, true);
  document.addEventListener('keydown', escAlerts);
}
function closeAlerts(){
  const dlg = document.getElementById('alert-dlg');
  if (!dlg) return;
  dlg.classList.remove('open');
  document.removeEventListener('click', outsideAlerts, true);
  document.removeEventListener('keydown', escAlerts);
}
function outsideAlerts(e){
  const dlg = document.getElementById('alert-dlg');
  const pill = document.getElementById('alerts');
  if (!dlg) return;
  if (dlg.contains(e.target) || (pill && pill.contains(e.target))) return;
  closeAlerts();
}
function escAlerts(e){ if (e.key === 'Escape') closeAlerts(); }

/* ----------------- v4: Wins ticker ---------------- */
const AGENT_COLOR = {
  foreman:'#c13b22', scout:'#3dd68c', builder:'#00e5ff', paymaster:'#d9a6ff', realtor:'#ffb347'
};

function snapshotState(){
  const snap = { biz: {}, apps: {}, rent: {} };
  (STATE.state.businesses || []).forEach(b => {
    snap.biz[b.name] = {
      hires: (b.hired_roster || []).length,
      income: (b.month_to_date && b.month_to_date.income) || 0,
      last_tick_at: b.last_tick_at || null,
      last_tick_summary: b.last_tick_summary || ''
    };
  });
  (STATE.re.applications || []).forEach(a => {
    const key = a.filename || a.slug || a.title;
    if (key) snap.apps[key] = { triaged: !!a.triaged, title: a.title || a.slug || key };
  });
  const roll = (STATE.re.rent_roll && STATE.re.rent_roll.tenants) || [];
  roll.forEach(t => {
    snap.rent[t.tenant] = { status: t.status || 'unknown' };
  });
  return snap;
}

function rentRank(s){
  // higher = better
  return { default: 0, behind: 1, partial: 2, current: 3 }[s] ?? 1;
}

function pushWin(color, msg){
  STATE.wins.unshift({ color, msg, ts: Date.now() });
  if (STATE.wins.length > 12) STATE.wins.length = 12;
}

function computeWins(){
  const next = snapshotState();
  // first pass: seed SEEN, do not emit wins
  if (!STATE.SEEN || STATE.winsFirstPass){
    STATE.SEEN = next;
    STATE.winsFirstPass = false;
    return;
  }
  const prev = STATE.SEEN;

  // Business-level diffs
  (STATE.state.businesses || []).forEach(b => {
    const name = b.name;
    const agent = FIRST[name] || (name || '').toUpperCase();
    const color = AGENT_COLOR[name] || '#00e5ff';
    const prevB = prev.biz[name];
    const nextB = next.biz[name];
    if (!prevB || !nextB) return;
    // 1. hires increased
    if (nextB.hires > prevB.hires){
      const newSlug = (b.hired_roster || [])[nextB.hires - 1];
      const slugLabel = newSlug && typeof newSlug === 'string' ? newSlug : (newSlug && (newSlug.slug || newSlug.name)) || 'new tool';
      pushWin(color, 'HANK filed hire: ' + slugLabel);
    }
    // 3. income increased
    if (nextB.income > prevB.income){
      const delta = Math.round(nextB.income - prevB.income);
      if (delta > 0) pushWin(color, agent + ' +$' + delta + ' income');
    }
    // 4. successful tick
    if (nextB.last_tick_at && nextB.last_tick_at !== prevB.last_tick_at){
      const summary = (nextB.last_tick_summary || '').toUpperCase();
      if (!summary.includes('FAIL')){
        pushWin(color, agent + ' tick shipped');
      }
    }
  });

  // 2. new applications
  Object.keys(next.apps).forEach(k => {
    if (!prev.apps[k]){
      const title = next.apps[k].title || k;
      pushWin('#ffb347', 'BRIX received application: ' + title);
    }
  });

  // 5. rent improving
  Object.keys(next.rent).forEach(tenant => {
    const prevS = prev.rent[tenant] && prev.rent[tenant].status;
    const nextS = next.rent[tenant].status;
    if (prevS && nextS && prevS !== nextS && rentRank(nextS) > rentRank(prevS)){
      const agent = FIRST[tenant] || (tenant || '').toUpperCase();
      const color = AGENT_COLOR[tenant] || '#3dd68c';
      pushWin(color, agent + ' rent status: ' + prevS + ' to ' + nextS);
    }
  });

  STATE.SEEN = next;
}

function buildWinPills(container, wins){
  wins.forEach(w => {
    const pill = H('span', {class:'win'});
    const dot = H('span', {class:'win-dot'});
    dot.style.background = w.color;
    dot.style.boxShadow = '0 0 6px ' + w.color + 'a0';
    pill.appendChild(dot);
    pill.appendChild(H('span', {class:'win-txt'}, w.msg));
    pill.appendChild(H('span', {class:'win-age'}, ageStr(w.ts)));
    container.appendChild(pill);
  });
}

function renderTicker(){
  const strip = document.getElementById('wins-strip');
  const wrap = document.getElementById('wins-wrap');
  if (!strip || !wrap) return;
  strip.innerHTML = '';
  // Clear any previous placeholder
  const oldEmpty = wrap.querySelector('.ticker-empty');
  if (oldEmpty) oldEmpty.remove();
  if (!STATE.wins.length){
    strip.style.animation = 'none';
    const empty = H('div', {class:'ticker-empty'}, '(watching for yard activity)');
    wrap.appendChild(empty);
    return;
  }
  strip.style.animation = '';
  // Duplicate list twice for seamless loop
  buildWinPills(strip, STATE.wins);
  buildWinPills(strip, STATE.wins);
  // Tune duration from content length (~40s default, add time for longer strips)
  const count = STATE.wins.length;
  const seconds = Math.max(22, Math.min(70, count * 4 + 18));
  strip.style.animationDuration = seconds + 's';
}

/* ----------------- Top bar stats ---------------- */
function renderStats(){
  const re = STATE.re;
  const roll = (re.rent_roll && re.rent_roll.tenants) || [];
  const behind = roll.filter(t => t.status === 'behind' || t.status === 'default').length;
  document.getElementById('kv-occ').textContent    = (re.occupancy_pct || 0) + '%';
  document.getElementById('kv-owed').textContent   = fmt(re.rent_roll && re.rent_roll.total_owed);
  document.getElementById('kv-paid').textContent   = fmt(re.rent_roll && re.rent_roll.total_paid);
  document.getElementById('kv-behind').textContent = behind;
  document.getElementById('kv-vacant').textContent = re.vacancies_total || 0;
  document.getElementById('kv-apps').textContent   = re.applications_total || 0;

  const h = currentHour();
  const phase = phaseOf(h);
  const duskLbl = {dawn:'DAWN',morning:'MORNING',midday:'MIDDAY',golden:'GOLDEN',dusk:'DUSK',blue:'BLUE HOUR',night:'NIGHT'}[phase];
  document.getElementById('dusk').textContent = duskLbl;
}

/* ----------------- Ledger panel ---------------- */
function contribFor(name, b){
  const hires    = (b.hired_roster || []).length;
  const products = (b.products_listed) || (b.month_to_date && b.month_to_date.products_listed) || 0;
  const projects = (b.project_count) || (b.month_to_date && b.month_to_date.projects) || 0;
  const ledgerE  = (b.ledger_entries) || (b.month_to_date && b.month_to_date.ledger_entries) || 0;
  const tenants  = (STATE.re.rent_roll && STATE.re.rent_roll.tenants || []).length;
  const vac      = STATE.re.vacancies_total || 0;
  if (name === 'foreman')   return { pct: Math.min(100, hires*10),     label: hires + ' hires filed' };
  if (name === 'scout')     return { pct: Math.min(100, products*33),  label: products + ' product listed' };
  if (name === 'builder')   return { pct: Math.min(100, projects*20),  label: projects + ' builds shipped' };
  if (name === 'paymaster') return { pct: Math.min(100, ledgerE*2),    label: ledgerE + ' ledger entries' };
  if (name === 'realtor')   return { pct: Math.min(100, tenants*12),   label: tenants + ' tenants + ' + vac + ' vacancies' };
  return { pct: 0, label: '' };
}
function renderLedger(){
  const rows = document.getElementById('tenant-rows');
  rows.innerHTML = '';
  const bizMap = new Map((STATE.state.businesses || []).map(b => [b.name, b]));
  const roll = (STATE.re.rent_roll && STATE.re.rent_roll.tenants) || [];
  const rollMap = new Map(roll.map(t => [t.tenant, t]));

  let mtdNet = 0;
  ['foreman','scout','builder','paymaster','realtor'].forEach(name => {
    const b = bizMap.get(name) || {};
    const r = rollMap.get(name);
    const income = (b.month_to_date && b.month_to_date.income) || 0;
    const rentMo = r ? r.rent_mo : (name === 'realtor' ? 0 : 20);
    const net = income - rentMo;
    mtdNet += net;
    const isActive = working(b);

    const li = H('li', {class:'tenant-row', 'data-agent': name});
    const head = H('div', {class:'row-head'});
    head.appendChild(H('div', {class:'row-name'}, FIRST[name] || name.toUpperCase()));
    head.appendChild(H('div', {class:'row-role'}, ROLE[name]));
    head.appendChild(H('div', {class: 'row-mode-dot' + (isActive ? ' active' : '')}));
    li.appendChild(head);

    const money = H('div', {class:'row-money'});
    money.appendChild(H('div', {class:'money-earned'}, fmt(income)));
    money.appendChild(H('div', {class:'money-rent'}, 'rent $' + rentMo + '/mo'));
    money.appendChild(H('div', {class:'money-net ' + (net >= 0 ? 'pos' : 'neg')}, (net >= 0 ? '+' : '') + fmt(net)));
    li.appendChild(money);

    li.appendChild(H('div', {class:'row-job'}, JOB_COPY[name]));

    const c = contribFor(name, b);
    const contrib = H('div', {class:'row-contrib'});
    const bar = H('div', {class:'contrib-bar'});
    const fill = H('div', {class:'contrib-fill'});
    fill.style.width = c.pct + '%';
    bar.appendChild(fill);
    contrib.appendChild(bar);
    contrib.appendChild(H('div', {class:'contrib-label'}, c.label));
    li.appendChild(contrib);
    rows.appendChild(li);
  });
  const kvNet = document.getElementById('kv-net');
  kvNet.textContent = (mtdNet >= 0 ? '+' : '') + fmt(mtdNet);
  kvNet.className = mtdNet < 0 ? 'neg' : '';
  const d = new Date();
  document.getElementById('server-hour').textContent = String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
}

/* ----------------- Main render ---------------- */
function render(){
  checkCarPurchases();
  computeWins();
  computeAlerts();
  renderSky();
  renderStats();
  renderVacancies();
  renderTenants();
  renderTraffic();
  renderCommute();
  renderSocial();
  renderLedger();
  renderAlertsPill();
  renderTicker();
  const dlg = document.getElementById('alert-dlg');
  if (dlg && dlg.classList.contains('open')) renderAlertsDialog();
}

function tickClock(){
  const d = new Date();
  document.getElementById('clock').textContent =
    [d.getHours(), d.getMinutes(), d.getSeconds()].map(n => String(n).padStart(2,'0')).join(':');
}
setInterval(tickClock, 1000); tickClock();

// Re-render sky + social + traffic each minute so the hour-based layer updates smoothly
setInterval(() => { renderSky(); renderCommute(); renderSocial(); renderTraffic(); }, 60000);

// Keep ticker + alerts ages fresh every 30s
setInterval(() => {
  renderTicker();
  const dlg = document.getElementById('alert-dlg');
  if (dlg && dlg.classList.contains('open')) renderAlertsDialog();
}, 30000);

function setLive(ok){
  const lamp = document.getElementById('lamp');
  const lbl = document.getElementById('lamp-lbl');
  lamp.classList.toggle('on', ok);
  lamp.classList.toggle('off', !ok);
  lbl.textContent = ok ? 'LIVE' : 'OFFLINE';
}
function openStream(){
  try {
    const sse = new EventSource('/api/stream');
    sse.addEventListener('hello', () => setLive(true));
    sse.addEventListener('change', () => { fetchState(); fetchActivity().then(render); });
    sse.addEventListener('realestate', () => { fetchRE().then(render); });
    sse.addEventListener('hire', () => { fetchState().then(render); });
    sse.onerror = () => setLive(false);
  } catch(e){}
}

fetchAll();
setInterval(fetchAll, 10000);
openStream();
