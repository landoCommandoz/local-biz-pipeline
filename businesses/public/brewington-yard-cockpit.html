<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>BREWINGTON YARD // COCKPIT</title>

<!--
  Brewington Yard Cockpit. Read-only display.
  Operator key hash is SHA-256 of "changeme" below. Rotate by replacing the constant
  inside the script block; never paste plaintext. agents.json contains zero secrets.
  Upgrade path: move operator-only fields behind a protected API with header-token auth
  when the cockpit is exposed publicly.
-->

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">

<style>
/* ============================================================
   TOKENS
   ============================================================ */
:root{
  --bg:#04040a;
  --bg-soft:#0a0a14;
  --tile:#0d0d0d;
  --wall-bg:rgba(255,255,255,0.02);
  --wall-border:rgba(255,255,255,0.05);
  --gold:#c9a84c;
  --gold-bright:#e8c96a;
  --gold-soft:rgba(201,168,76,0.6);
  --gold-line:rgba(201,168,76,0.2);
  --gold-faint:rgba(201,168,76,0.08);
  --teal:#2dd4c0;
  --text-1:#f0f0f0;
  --text-2:#888896;
  --text-3:#55555c;
  --red-biblical:#a64040;
  --green-biblical:#4a7a50;
  --tile-shadow:0 8px 32px rgba(0,0,0,0.6);
  --tile-hover-shadow:0 12px 48px rgba(201,168,76,0.3);
  --grain:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.95  0 0 0 0 0.92  0 0 0 0 0.85  0 0 0 0.16 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
}

/* ============================================================
   RESET
   ============================================================ */
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%}
html{background:var(--bg)}
body{
  background:var(--bg);
  color:var(--text-1);
  font-family:"Plus Jakarta Sans",sans-serif;
  font-size:14px;
  line-height:1.5;
  overflow:hidden;
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input{font:inherit;color:inherit}
h1,h2,h3,h4,h5,h6,p{margin:0}
.bebas{font-family:"Bebas Neue",sans-serif;letter-spacing:0.06em}
.mono{font-family:"Share Tech Mono",monospace}

/* ============================================================
   COCKPIT FRAME
   ============================================================ */
.cockpit{
  position:fixed;inset:0;
  perspective:1800px;
  perspective-origin:50% 45%;
  background:radial-gradient(ellipse 80% 60% at 50% 45%, #0a0a14 0%, #04040a 55%, #000 100%);
  overflow:hidden;
}

/* Atmosphere layers */
.vignette{
  position:absolute;inset:0;
  pointer-events:none;
  background:
    radial-gradient(ellipse 70% 55% at 50% 50%, transparent 40%, rgba(0,0,0,0.7) 90%, #000 100%),
    linear-gradient(180deg, rgba(0,0,0,0.3) 0%, transparent 25%, transparent 75%, rgba(0,0,0,0.4) 100%);
  z-index:4;
}
.grain{
  position:absolute;inset:0;
  pointer-events:none;
  background-image:var(--grain);
  background-size:160px 160px;
  opacity:0.5;
  mix-blend-mode:overlay;
  z-index:6;
}
.circuits{
  position:absolute;inset:0;
  pointer-events:none;
  width:100%;height:100%;
  opacity:0.35;
  z-index:2;
}
.circuits circle{fill:var(--gold-soft)}
.circuits .ring{
  fill:none;stroke:var(--gold-line);stroke-width:1;
  transform-origin:50% 50%;
  animation:ringPulse 4s ease-in-out infinite;
}
.circuits .ring-2{animation-delay:1.3s}
.circuits .ring-3{animation-delay:2.6s}
.circuits .line{stroke:var(--gold-faint);stroke-width:1;fill:none}

/* Corner brackets */
.corner{
  position:absolute;
  width:44px;height:44px;
  z-index:8;
  pointer-events:none;
  opacity:0;
  transition:opacity 900ms ease-out;
}
.corner.show{opacity:1}
.corner::before,.corner::after{
  content:"";position:absolute;background:var(--gold);
}
.corner::before{width:100%;height:2px}
.corner::after{width:2px;height:100%}
.corner.tl{top:20px;left:20px}
.corner.tl::before{top:0;left:0}
.corner.tl::after{top:0;left:0}
.corner.tr{top:20px;right:20px}
.corner.tr::before{top:0;right:0}
.corner.tr::after{top:0;right:0}
.corner.bl{bottom:60px;left:20px}
.corner.bl::before{bottom:0;left:0}
.corner.bl::after{bottom:0;left:0}
.corner.br{bottom:60px;right:20px}
.corner.br::before{bottom:0;right:0}
.corner.br::after{bottom:0;right:0}

/* ============================================================
   CHROME
   ============================================================ */
.chrome-top{
  position:absolute;top:0;left:0;right:0;
  display:flex;align-items:flex-start;justify-content:space-between;
  padding:34px 44px 0 44px;
  z-index:20;
  pointer-events:none;
}
.logo{
  font-family:"Bebas Neue",sans-serif;
  font-size:22px;letter-spacing:0.28em;
  color:var(--gold);
  opacity:0;
  transform:translateY(2px);
  transition:opacity 400ms ease-out, transform 400ms ease-out;
}
.logo.show{opacity:1;transform:translateY(0)}
.logo .sep{color:var(--text-3);margin:0 10px;font-size:16px;vertical-align:1px}
.logo .small{color:var(--text-2);letter-spacing:0.25em;font-size:13px}

.chrome-right{
  display:flex;flex-direction:column;align-items:flex-end;gap:10px;
  pointer-events:none;
}
.clock{
  font-family:"Share Tech Mono",monospace;
  font-size:13px;
  color:var(--teal);
  letter-spacing:0.18em;
  opacity:0;
  transition:opacity 400ms ease-out 150ms;
}
.clock.show{opacity:1}
.clock .sys{color:var(--text-3);margin-right:10px}

.op-indicator{
  display:flex;align-items:center;gap:10px;
  font-family:"Share Tech Mono",monospace;
  font-size:11px;letter-spacing:0.24em;
  color:var(--gold);
  opacity:0;
  pointer-events:auto;
  cursor:pointer;
  padding:6px 10px;
  border:1px solid var(--gold-line);
  background:rgba(4,4,10,0.6);
  backdrop-filter:blur(6px);
  transition:opacity 600ms ease-out, background 200ms ease-out;
}
.op-indicator:hover{background:rgba(201,168,76,0.08)}
body.operator-mode .op-indicator{opacity:1}
.op-dot{
  width:8px;height:8px;border-radius:50%;
  background:var(--gold);
  box-shadow:0 0 10px var(--gold-soft);
  animation:opPulse 2s ease-in-out infinite;
}
@keyframes opPulse{
  0%,100%{opacity:1;transform:scale(1)}
  50%{opacity:0.55;transform:scale(0.85)}
}
.op-badges{display:inline-flex;gap:6px}
.op-badge{
  display:inline-flex;align-items:center;justify-content:center;
  min-width:18px;height:18px;
  padding:0 5px;
  border-radius:9px;
  font-size:10px;letter-spacing:0.08em;
  background:rgba(201,168,76,0.15);
  border:1px solid var(--gold-line);
  color:var(--gold-bright);
}
.op-badge.dot{
  padding:0;min-width:8px;width:8px;height:8px;border-radius:50%;
  background:var(--red-biblical);border-color:transparent;
  box-shadow:0 0 8px rgba(166,64,64,0.6);
  animation:opPulse 1.6s ease-in-out infinite;
}
.op-badge.gold{
  background:var(--gold);color:#1a1306;border-color:var(--gold);
  animation:opPulse 2.4s ease-in-out infinite;
}

/* ============================================================
   STAGE + WALLS
   ============================================================ */
.stage{
  position:absolute;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:0;
  padding:96px 60px 84px 60px;
  transform-style:preserve-3d;
  z-index:3;
  opacity:0;
  transform:scale(0.985);
  transition:opacity 1200ms cubic-bezier(0.22,0.8,0.36,1), transform 1200ms cubic-bezier(0.22,0.8,0.36,1);
}
.stage.show{opacity:1;transform:scale(1)}

.wall{
  flex:1 1 0;
  max-width:40vw;
  min-width:0;
  height:100%;
  display:grid;
  grid-template-columns:repeat(3, minmax(0,1fr));
  grid-template-rows:repeat(2, minmax(0,1fr));
  gap:12px;
  padding:14px;
  background:var(--wall-bg);
  border:1px solid var(--wall-border);
  position:relative;
  transform-style:preserve-3d;
  backface-visibility:hidden;
}
.wall::before{
  content:"";
  position:absolute;inset:0;
  background:linear-gradient(180deg, rgba(201,168,76,0.03), transparent 30%, transparent 70%, rgba(0,0,0,0.4));
  pointer-events:none;
}
.wall-left{transform-origin:100% 50%;transform:rotateY(25deg)}
.wall-center{transform-origin:50% 50%}
.wall-right{transform-origin:0 50%;transform:rotateY(-25deg)}

.wall-label{
  position:absolute;
  top:-14px;left:16px;
  padding:2px 10px;
  background:var(--bg);
  font-family:"Share Tech Mono",monospace;
  font-size:10px;letter-spacing:0.3em;
  color:var(--gold);
  opacity:0.55;
  border:1px solid var(--gold-line);
}

/* ============================================================
   ROOM TILE
   ============================================================ */
.tile{
  --agent:#c9a84c;
  position:relative;
  background:var(--tile);
  border:2px solid color-mix(in srgb, var(--agent) 22%, transparent);
  overflow:hidden;
  cursor:pointer;
  box-shadow:var(--tile-shadow);
  opacity:0;
  transform:translateY(6px);
  transition:
    transform 220ms ease-out,
    box-shadow 220ms ease-out,
    filter 220ms ease-out,
    border-color 220ms ease-out,
    opacity 500ms ease-out;
  will-change:transform;
}
.tile.shown{opacity:1;transform:translateY(0)}

.tile:hover{
  transform:translateY(-4px) scale(1.02);
  filter:brightness(1.1);
  box-shadow:var(--tile-hover-shadow);
  border-color:color-mix(in srgb, var(--agent) 55%, transparent);
  z-index:5;
}

.tile video,
.tile .fallback{
  position:absolute;inset:0;
  width:100%;height:100%;
  object-fit:cover;
  z-index:1;
  background:#07070d;
}
.tile .fallback{display:flex;align-items:center;justify-content:center}
.tile .fallback svg{width:75%;height:75%;opacity:0.6}
.tile video{opacity:0;transition:opacity 600ms ease-out 80ms}
.tile video.ready{opacity:1}

/* Tile atmosphere */
.tile::before{
  content:"";
  position:absolute;inset:0;z-index:2;
  background:
    radial-gradient(ellipse 90% 70% at 50% 55%, transparent 40%, rgba(0,0,0,0.55) 100%),
    linear-gradient(180deg, rgba(0,0,0,0.2) 0%, transparent 35%, rgba(0,0,0,0.35) 100%);
  pointer-events:none;
}
.tile::after{
  content:"";
  position:absolute;inset:0;z-index:3;
  background-image:var(--grain);
  background-size:140px 140px;
  opacity:0.35;
  mix-blend-mode:overlay;
  pointer-events:none;
}

/* Name plate, always visible */
.plate{
  position:absolute;
  bottom:12px;left:12px;
  z-index:7;
  max-width:35%;max-height:12%;
  padding:4px 8px;
  font-family:"Bebas Neue",sans-serif;
  font-size:16px;
  letter-spacing:0.1em;
  color:var(--gold);
  background:rgba(4,4,10,0.75);
  border:1px solid var(--gold-line);
  line-height:1;
  white-space:nowrap;
  opacity:0;
  transform:translateY(2px);
  transition:color 200ms ease-out, transform 200ms ease-out, opacity 300ms ease-out;
}
.plate.shown{opacity:1;transform:translateY(0)}
.tile:hover .plate{color:var(--gold-bright)}

/* Bay status styling: public mode keeps solid border from base rule.
   Operator mode unlocks per-status treatments. */
body.operator-mode .tile[data-bay="active"]{
  border-color:color-mix(in srgb, var(--agent) 70%, transparent);
  border-style:solid;
}
body.operator-mode .tile[data-bay="scaffolded"]{
  border-color:color-mix(in srgb, var(--agent) 55%, transparent);
  border-style:dashed;
}
body.operator-mode .tile[data-bay="installing"]{
  border-style:solid;
  animation:borderPulse 1.8s ease-in-out infinite;
}
body.operator-mode .tile[data-bay="awaiting_reddit_oauth"],
body.operator-mode .tile[data-bay="awaiting_itch_setup"]{
  border-color:color-mix(in srgb, var(--agent) 40%, transparent);
  border-style:dotted;
}
@keyframes borderPulse{
  0%,100%{border-color:color-mix(in srgb, var(--agent) 25%, transparent);box-shadow:var(--tile-shadow)}
  50%{border-color:color-mix(in srgb, var(--agent) 85%, transparent);box-shadow:0 8px 32px rgba(0,0,0,0.6), 0 0 16px color-mix(in srgb, var(--agent) 30%, transparent)}
}

/* Unknown/warning tile for missing-field fallback */
.tile.warn{
  --agent:#55555c;
  background:#0a0a10;
  border-style:dashed;
}
.tile.warn .plate{color:#aaa}
.tile.warn .fallback svg{opacity:0.3}

/* HIRE special tile */
.tile.hire{
  cursor:default;
  background:
    radial-gradient(ellipse 65% 40% at 50% 35%, rgba(70,58,30,0.35) 0%, transparent 70%),
    #0a0a10;
  border:2px dashed #2a2a33;
}
.tile.hire:hover{
  transform:none;filter:none;box-shadow:var(--tile-shadow);border-color:#2a2a33;
}
.tile.hire .lamp{
  position:absolute;
  top:18%;left:50%;
  transform:translateX(-50%);
  width:2px;height:14%;
  background:linear-gradient(180deg, #1a1a20 0%, #3a3a45 100%);
  z-index:3;
}
.tile.hire .bulb{
  position:absolute;
  top:calc(18% + 14%);left:50%;
  transform:translateX(-50%);
  width:58%;height:36%;
  background:radial-gradient(ellipse at 50% 30%, rgba(201,168,76,0.45) 0%, rgba(201,168,76,0.14) 30%, transparent 68%);
  z-index:2;
  animation:flickA 2.1s infinite steps(1,end);
}
.tile.hire .bulb::before{
  content:"";position:absolute;inset:0;
  background:radial-gradient(circle at 50% 32%, rgba(232,201,106,0.7) 0%, transparent 22%);
  animation:flickB 2.7s infinite steps(1,end);
  animation-delay:0.4s;
}
.tile.hire .bulb::after{
  content:"";position:absolute;inset:0;
  background:radial-gradient(ellipse at 50% 30%, rgba(201,168,76,0.2) 0%, transparent 38%);
  animation:flickC 3.1s infinite steps(1,end);
  animation-delay:0.9s;
}
@keyframes flickA{
  0%,14%,18%,62%,66%,100%{opacity:0.7}
  15%,17%{opacity:0.5}
  63%,65%{opacity:0.55}
  80%,84%{opacity:0.7}
  81%,83%{opacity:0.35}
}
@keyframes flickB{
  0%,30%,100%{opacity:0.8}
  31%,37%{opacity:0.45}
  58%,88%{opacity:0.8}
  59%,61%{opacity:0.35}
  89%,92%{opacity:0.55}
}
@keyframes flickC{
  0%,22%,50%,70%,92%,100%{opacity:0.6}
  23%,25%{opacity:0.3}
  51%,53%{opacity:0.3}
  71%,74%{opacity:0.35}
}
.tile.hire .sign{
  position:absolute;
  top:56%;left:50%;
  transform:translate(-50%,-50%);
  z-index:4;
  font-family:"Bebas Neue",sans-serif;
  font-size:22px;letter-spacing:0.3em;
  color:var(--gold-bright);
  text-shadow:0 0 8px rgba(201,168,76,0.4);
  opacity:0.82;
}
.tile.hire .counter{
  position:absolute;
  top:76%;left:50%;
  transform:translate(-50%,0);
  z-index:4;
  font-family:"Share Tech Mono",monospace;
  font-size:11px;letter-spacing:0.28em;
  color:var(--text-2);
}
.tile.hire.unlocked{
  cursor:pointer;
  border-color:color-mix(in srgb, var(--gold) 70%, transparent);
  animation:hireUnlock 1.4s ease-out 3;
}
.tile.hire.unlocked .bulb,
.tile.hire.unlocked .bulb::before,
.tile.hire.unlocked .bulb::after{animation:none;opacity:0.9}
@keyframes hireUnlock{
  0%,100%{border-color:color-mix(in srgb, var(--gold) 70%, transparent);box-shadow:var(--tile-shadow)}
  50%{border-color:var(--gold);box-shadow:0 8px 32px rgba(0,0,0,0.6), 0 0 24px rgba(201,168,76,0.55)}
}

/* ============================================================
   TICKER
   ============================================================ */
.ticker{
  position:absolute;bottom:0;left:0;right:0;
  height:44px;
  background:linear-gradient(to top, rgba(0,0,0,0.92) 0%, rgba(0,0,0,0.7) 60%, transparent 100%);
  border-top:1px solid var(--gold-line);
  overflow:hidden;
  z-index:15;
  opacity:0;
  transform:translateY(6px);
  transition:opacity 500ms ease-out, transform 500ms ease-out;
}
.ticker.show{opacity:1;transform:translateY(0)}
.ticker-track{
  display:inline-block;
  white-space:nowrap;
  padding-left:100vw;
  line-height:44px;
  font-family:"Share Tech Mono",monospace;
  font-size:12px;letter-spacing:0.25em;
  color:var(--teal);
  animation:tickerScroll 60s linear infinite;
}
.ticker-track .accent{color:var(--gold)}
.ticker-track .sep{color:var(--text-3);margin:0 18px}
@keyframes tickerScroll{
  0%{transform:translateX(0)}
  100%{transform:translateX(-50%)}
}

/* ============================================================
   DETAIL PANEL
   ============================================================ */
.panel{
  position:fixed;top:0;bottom:0;right:0;
  width:420px;max-width:100vw;
  background:rgba(10,10,14,0.95);
  backdrop-filter:blur(14px);
  -webkit-backdrop-filter:blur(14px);
  border-left:1px solid var(--gold-line);
  z-index:60;
  transform:translateX(100%);
  transition:transform 400ms cubic-bezier(0.4,0,0.2,1);
  padding:44px 36px 32px 36px;
  overflow-y:auto;
  visibility:hidden;
}
.panel.open{transform:translateX(0);visibility:visible}
.panel-close{
  position:absolute;top:16px;right:16px;
  width:32px;height:32px;
  display:flex;align-items:center;justify-content:center;
  border:1px solid var(--gold-line);
  color:var(--text-2);
  font-size:18px;line-height:1;
  transition:color 150ms ease-out, border-color 150ms ease-out;
}
.panel-close:hover{color:var(--gold);border-color:var(--gold-soft)}
.panel-name{
  font-family:"Bebas Neue",sans-serif;
  font-size:40px;letter-spacing:0.08em;
  color:var(--text-1);
  line-height:1;
  margin-bottom:4px;
}
.panel-role{
  font-family:"Share Tech Mono",monospace;
  font-size:11px;letter-spacing:0.3em;
  color:var(--teal);
  text-transform:uppercase;
  margin-bottom:22px;
}
.panel-divider{
  width:48px;height:2px;
  background:var(--gold);
  margin-bottom:22px;
}
.panel-bio{
  font-family:"Plus Jakarta Sans",sans-serif;
  font-size:15px;line-height:1.65;
  color:var(--text-1);
  font-weight:400;
}
.panel-section{
  margin-top:22px;
  padding-top:18px;
  border-top:1px solid var(--gold-faint);
}
.panel-section .k{
  font-family:"Share Tech Mono",monospace;
  font-size:10px;letter-spacing:0.28em;
  color:var(--text-3);
  margin-bottom:6px;
  text-transform:uppercase;
}
.panel-section .v{
  font-family:"Plus Jakarta Sans",sans-serif;
  font-size:14px;line-height:1.55;
  color:var(--text-1);
}
.panel-mission{font-size:14px;line-height:1.65;color:var(--text-1)}
.panel-task{
  padding:12px 14px;
  border:1px solid var(--gold-faint);
  background:rgba(201,168,76,0.04);
  font-size:13px;line-height:1.55;
  margin-top:8px;
}
.panel-stats{
  display:grid;
  grid-template-columns:1fr auto;
  gap:6px 18px;
  font-family:"Share Tech Mono",monospace;
  font-size:12px;
  margin-top:8px;
}
.panel-stats .sk{color:var(--text-2);letter-spacing:0.12em}
.panel-stats .sv{color:var(--gold-bright);text-align:right}
.panel-kvrow{
  display:grid;
  grid-template-columns:max-content 1fr;
  gap:6px 14px;
  font-family:"Share Tech Mono",monospace;
  font-size:12px;color:var(--text-2);
  margin-top:8px;
}
.panel-kvrow .k2{color:var(--text-3);letter-spacing:0.18em}
.panel-kvrow .v2{color:var(--text-1)}
.panel-chip{
  display:inline-block;
  padding:3px 9px;
  font-family:"Share Tech Mono",monospace;
  font-size:10px;letter-spacing:0.22em;
  color:var(--gold-bright);
  border:1px solid var(--gold-line);
  background:rgba(201,168,76,0.06);
  margin-right:6px;margin-top:4px;
}
.panel-chip.cost{color:var(--teal);border-color:rgba(45,212,192,0.3)}
.panel-chip.locked{color:var(--text-3);border-color:#2a2a33;background:transparent}
.panel-upgrade{
  margin-top:18px;
  padding:12px 14px;
  border:1px dashed var(--gold-line);
  font-family:"Plus Jakarta Sans",sans-serif;font-size:13px;
  color:var(--text-2);
}
.panel-upgrade strong{color:var(--gold);font-weight:600;letter-spacing:0.04em}

/* Public mode hides operator-only sections */
body.public-mode .panel-section.op{display:none}

/* ============================================================
   UNLOCK OVERLAY
   ============================================================ */
.overlay{
  position:fixed;inset:0;
  background:rgba(4,4,10,0.95);
  backdrop-filter:blur(10px);
  -webkit-backdrop-filter:blur(10px);
  z-index:200;
  display:flex;align-items:center;justify-content:center;
  opacity:0;
  pointer-events:none;
  transition:opacity 280ms ease-out;
}
.overlay.open{opacity:1;pointer-events:auto}
.unlock-box{
  background:#0a0a10;
  border:1px solid var(--gold-line);
  padding:40px 40px 32px 40px;
  min-width:340px;
  position:relative;
}
.unlock-box::before,
.unlock-box::after{
  content:"";
  position:absolute;
  width:18px;height:18px;
  border:1px solid var(--gold);
}
.unlock-box::before{top:-1px;left:-1px;border-right:0;border-bottom:0}
.unlock-box::after{bottom:-1px;right:-1px;border-left:0;border-top:0}
.unlock-title{
  font-family:"Share Tech Mono",monospace;
  font-size:11px;letter-spacing:0.4em;
  color:var(--gold);
  text-align:center;
  margin-bottom:6px;
}
.unlock-sub{
  font-family:"Plus Jakarta Sans",sans-serif;
  font-size:12px;
  color:var(--text-3);
  text-align:center;
  margin-bottom:24px;
}
.unlock-input{
  display:block;width:100%;
  padding:12px 14px;
  background:transparent;
  border:1px solid var(--gold-line);
  color:var(--gold-bright);
  font-family:"Share Tech Mono",monospace;
  font-size:14px;letter-spacing:0.24em;
  text-align:center;
  outline:none;
  transition:border-color 150ms, box-shadow 150ms;
}
.unlock-input:focus{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold-soft)}
.unlock-input.shake{animation:shake 420ms cubic-bezier(0.36,0.07,0.19,0.97) both}
@keyframes shake{
  10%,90%{transform:translateX(-1px)}
  20%,80%{transform:translateX(2px)}
  30%,50%,70%{transform:translateX(-4px)}
  40%,60%{transform:translateX(4px)}
}
.unlock-actions{
  display:flex;justify-content:space-between;gap:12px;
  margin-top:16px;
}
.btn{
  flex:1;padding:10px 14px;
  font-family:"Share Tech Mono",monospace;
  font-size:11px;letter-spacing:0.3em;
  border:1px solid var(--gold-line);
  color:var(--gold-bright);
  background:transparent;
  transition:background 150ms, border-color 150ms, color 150ms;
}
.btn:hover{background:rgba(201,168,76,0.08);border-color:var(--gold-soft)}
.btn.ghost{color:var(--text-2);border-color:rgba(136,136,150,0.3)}
.btn.ghost:hover{color:var(--text-1);background:rgba(136,136,150,0.05)}

.unlock-err{
  margin-top:10px;
  text-align:center;
  font-family:"Share Tech Mono",monospace;
  font-size:10px;letter-spacing:0.3em;
  color:var(--red-biblical);
  min-height:14px;
  opacity:0;
}
.unlock-err.show{opacity:1}

/* Operator mode flash */
.mode-flash{
  position:fixed;inset:0;
  pointer-events:none;
  z-index:150;
  opacity:0;
  background:radial-gradient(circle at 50% 45%, rgba(201,168,76,0.5) 0%, rgba(201,168,76,0.15) 28%, transparent 55%);
}
.mode-flash.fire{animation:flash 600ms ease-out both}
@keyframes flash{
  0%{opacity:0}
  30%{opacity:1}
  100%{opacity:0}
}

/* Fatal error tile */
.fatal{
  position:absolute;inset:0;
  display:flex;align-items:center;justify-content:center;
  z-index:30;
}
.fatal .card{
  border:1px solid var(--gold-soft);
  padding:24px 32px;
  text-align:center;
  background:rgba(10,10,14,0.9);
}
.fatal .card h3{
  font-family:"Bebas Neue",sans-serif;font-size:24px;letter-spacing:0.2em;color:var(--gold)
}
.fatal .card p{
  font-family:"Share Tech Mono",monospace;font-size:11px;letter-spacing:0.2em;color:var(--text-2);margin-top:6px;
}

/* Circuit ring animation */
@keyframes ringPulse{
  0%{opacity:0.15;stroke-width:1}
  50%{opacity:0.6;stroke-width:1.4}
  100%{opacity:0.15;stroke-width:1}
}

/* ============================================================
   MOBILE
   ============================================================ */
@media (max-width:900px){
  .stage{padding:86px 18px 70px 18px}
  .wall{max-width:38vw}
  .logo{font-size:18px}
  .panel{width:100vw;border-left:0}
}
@media (max-width:767px){
  .cockpit{perspective:none}
  .stage{
    position:absolute;inset:0;
    display:flex;flex-direction:column;
    gap:18px;
    padding:80px 0 70px 0;
    overflow-y:auto;
    align-items:stretch;
    justify-content:flex-start;
    transform:none !important;
  }
  .wall{
    flex:0 0 auto;
    max-width:none;width:100%;
    display:flex;
    grid-template-columns:none;
    overflow-x:auto;
    scroll-snap-type:x mandatory;
    padding:24px 16px 14px 16px;
    gap:12px;
    transform:none !important;
    height:auto;
  }
  .wall::-webkit-scrollbar{height:4px}
  .wall::-webkit-scrollbar-thumb{background:var(--gold-line)}
  .wall-label{opacity:1}
  .tile{
    flex:0 0 180px;
    height:220px;
    scroll-snap-align:start;
  }
  .plate{font-size:12px;padding:3px 6px;bottom:8px;left:8px}
  .tile.hire .sign{font-size:14px}
  .tile.hire .counter{font-size:10px}
  .panel{
    top:auto;bottom:-100%;left:0;right:0;width:100%;
    height:68vh;
    border-left:0;border-top:1px solid var(--gold-line);
    transform:translateY(0);
    padding:32px 24px;
    transition:bottom 400ms cubic-bezier(0.4,0,0.2,1);
  }
  .panel.open{bottom:0;transform:translateY(0)}
  .panel::before{
    content:"";
    position:absolute;top:10px;left:50%;transform:translateX(-50%);
    width:36px;height:3px;border-radius:2px;background:var(--gold-line);
  }
  .corner.bl{bottom:58px}
  .corner.br{bottom:58px}
  .chrome-top{padding:22px 18px 0 18px}
}

/* Reduced motion */
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{
    animation-duration:0.01ms !important;
    animation-iteration-count:1 !important;
    transition-duration:0.12s !important;
  }
  .ticker-track{animation:none}
  .tile:hover{transform:none}
}

/* Initial load gate */
body.loading .stage,
body.loading .ticker,
body.loading .logo,
body.loading .clock,
body.loading .corner{opacity:0}

<script>
"use strict";

/* ============================================================
   CONFIG
   ============================================================ */
// SHA-256 of the placeholder operator key "changeme".
// Rotate by replacing this constant with a new SHA-256 hex digest.
const OPERATOR_HASH = "057ba03d6c44104863dc7361fe4578965d1887360f90a0895882e58a6248fc86";
const AGENT_URL = "/agents.json";
const RENT_URL = "/businesses/realtor/rent-roll.json";
const PNL_URL = "/businesses/pnl.json";

// Brand ticker for public mode
const PUBLIC_TICKER = [
  "BREWINGTON YARD", "18 AGENTS", "ALWAYS RUNNING",
  "DONE FOR YOU AUTOMATION FOR LOCAL BUSINESS"
];

/* ============================================================
   STATE
   ============================================================ */
const state = {
  agents: null,
  rent: null,
  pnl: null,
  mode: sessionStorage.getItem("by_op") === "1" ? "operator" : "public",
  selectedId: null,
  videoObserver: null,
};

const $ = (id) => document.getElementById(id);

/* ============================================================
   UTIL
   ============================================================ */
async function sha256(text){
  const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(text));
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,"0")).join("");
}

function fmtMoney(n){
  if (n == null || isNaN(n)) return "$0";
  const v = Math.round(Number(n));
  return "$" + v.toLocaleString("en-US");
}
function fmtNum(n){
  if (n == null || isNaN(n)) return "0";
  return Math.round(Number(n)).toLocaleString("en-US");
}
function fmtPct(n){
  if (n == null || isNaN(n)) return "0%";
  return Math.round(Number(n)) + "%";
}
function safeStr(v){
  return (v == null) ? "" : String(v);
}
function humanKey(k){
  return String(k).replace(/_/g," ").toUpperCase();
}
function esc(s){
  return String(s).replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
}

/* ============================================================
   FETCH + VALIDATE
   ============================================================ */
async function fetchAll(){
  async function tryFetch(url){
    try{
      const r = await fetch(url, {cache:"no-store"});
      if (!r.ok) return null;
      return await r.json();
    } catch(e){ return null; }
  }
  const [a, r, p] = await Promise.all([
    tryFetch(AGENT_URL),
    tryFetch(RENT_URL),
    tryFetch(PNL_URL),
  ]);
  state.agents = a;
  state.rent = r;
  state.pnl = p;
}

function validateAgents(){
  if (!state.agents || !Array.isArray(state.agents.agents)) return false;
  if (state.agents.agents.length !== 18) return false;
  return true;
}

/* ============================================================
   RENDER: CHROME BOOT
   ============================================================ */
function bootChrome(){
  ["cornerTL","cornerTR","cornerBL","cornerBR"].forEach(id => $(id).classList.add("show"));
  $("logo").classList.add("show");
  $("clock").classList.add("show");
  startClock();
}

function startClock(){
  const el = $("clockVal");
  const tick = () => {
    const d = new Date();
    const pad = (n) => String(n).padStart(2,"0");
    el.textContent = pad(d.getHours()) + ":" + pad(d.getMinutes()) + ":" + pad(d.getSeconds());
  };
  tick();
  setInterval(tick, 1000);
}

/* ============================================================
   RENDER: WALLS + TILES
   ============================================================ */
function renderWalls(){
  const publicFields = state.agents.public_fields || ["id","name","role","color","wall","position","video_file","public_bio"];
  const walls = {left: $("wallLeft"), center: $("wallCenter"), right: $("wallRight")};

  // Group and sort by row/col
  const bucket = {left:[], center:[], right:[]};
  state.agents.agents.forEach(a => {
    const w = (a.wall || "center");
    if (!bucket[w]) bucket[w] = [];
    bucket[w].push(a);
  });
  Object.keys(bucket).forEach(k => {
    bucket[k].sort((a,b) => {
      const ra = a.position?.row || 1, rb = b.position?.row || 1;
      if (ra !== rb) return ra - rb;
      return (a.position?.col || 1) - (b.position?.col || 1);
    });
  });

  Object.keys(bucket).forEach(wallKey => {
    const wallEl = walls[wallKey];
    if (!wallEl) return;
    bucket[wallKey].forEach(agent => {
      const tile = buildTile(agent, publicFields);
      wallEl.appendChild(tile);
    });
  });

  // Stagger reveal, center wall first then radiate outward.
  const all = Array.from(document.querySelectorAll(".tile"));
  // Order: center columns first then left/right simultaneously, by visual distance from center
  const order = all.slice().sort((a, b) => {
    const pr = (el) => {
      const w = el.dataset.wall, r = Number(el.dataset.row) || 1, c = Number(el.dataset.col) || 1;
      const wallWeight = w === "center" ? 0 : 1;
      const colWeight = w === "left" ? 4 - c : (w === "right" ? c : Math.abs(2 - c));
      return wallWeight * 10 + colWeight + (r - 1) * 2;
    };
    return pr(a) - pr(b);
  });
  requestAnimationFrame(() => {
    $("stage").classList.add("show");
    order.forEach((tile, i) => {
      setTimeout(() => {
        tile.classList.add("shown");
        const plate = tile.querySelector(".plate");
        if (plate) setTimeout(() => plate.classList.add("shown"), 150);
      }, 400 + i * 80);
    });
    setTimeout(() => {
      $("ticker").classList.add("show");
    }, 400 + order.length * 80 + 120);
  });
}

function buildTile(agent, publicFields){
  const el = document.createElement("article");
  el.className = "tile";
  el.dataset.id = agent.id;
  el.dataset.wall = agent.wall || "";
  el.dataset.row = String(agent.position?.row || 1);
  el.dataset.col = String(agent.position?.col || 1);
  el.dataset.bay = agent.bay_status || "";
  el.style.setProperty("--agent", agent.color || "#c9a84c");
  el.style.gridRow = String(agent.position?.row || 1);
  el.style.gridColumn = String(agent.position?.col || 1);

  // Field validation: each agent must contain every public field; otherwise render warn
  const missing = publicFields.filter(f => !(f in agent));
  if (missing.length){
    el.classList.add("warn");
    el.innerHTML = `
      <div class="fallback">${roomSvg("#55555c")}</div>
      <span class="plate" title="Missing: ${esc(missing.join(", "))}">${esc(agent.name || agent.id || "UNKNOWN")}</span>
    `;
    el.addEventListener("click", () => openPanel(agent));
    return el;
  }

  // HIRE special
  if (agent.id === "hire"){
    el.classList.add("hire");
    const vault = state.agents.agents.find(a => a.id === "vault");
    const active = vault?.stats?.active_clients ?? 0;
    const need = vault?.stats?.unlock_at_active_clients ?? 5;
    el.innerHTML = `
      <div class="lamp"></div>
      <div class="bulb"></div>
      <div class="sign">HIRING</div>
      <div class="counter">${esc(String(active))} OF ${esc(String(need))} CLIENTS</div>
      <span class="plate">HIRE</span>
    `;
    if (active >= need){
      el.classList.add("unlocked");
      el.addEventListener("click", () => openPanel(agent));
    }
    return el;
  }

  // Normal tile: video + atmosphere + plate
  const src = agent.video_file || "";
  const name = esc(agent.name || agent.id || "");
  el.innerHTML = `
    <video muted playsinline loop preload="metadata" data-src="${esc(src)}"></video>
    <div class="fallback" hidden>${roomSvg(agent.color || "#c9a84c")}</div>
    <span class="plate">${name}</span>
  `;
  el.addEventListener("click", () => openPanel(agent));
  return el;
}

function roomSvg(color){
  const c = color;
  return `<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <defs>
      <linearGradient id="g1" x1="0" x2="0" y1="0" y2="1">
        <stop offset="0%" stop-color="${c}" stop-opacity="0.18"/>
        <stop offset="100%" stop-color="${c}" stop-opacity="0.04"/>
      </linearGradient>
    </defs>
    <!-- iso floor -->
    <polygon points="100,150 30,115 100,80 170,115" fill="${c}" fill-opacity="0.08" stroke="${c}" stroke-opacity="0.3" stroke-width="0.6"/>
    <!-- left wall -->
    <polygon points="30,115 30,45 100,10 100,80" fill="url(#g1)" stroke="${c}" stroke-opacity="0.3" stroke-width="0.6"/>
    <!-- right wall -->
    <polygon points="100,80 100,10 170,45 170,115" fill="${c}" fill-opacity="0.05" stroke="${c}" stroke-opacity="0.3" stroke-width="0.6"/>
    <!-- door -->
    <polygon points="60,135 60,95 80,85 80,125" fill="#000" fill-opacity="0.5" stroke="${c}" stroke-opacity="0.3" stroke-width="0.5"/>
    <!-- window -->
    <polygon points="130,58 130,38 160,53 160,73" fill="${c}" fill-opacity="0.12" stroke="${c}" stroke-opacity="0.35" stroke-width="0.5"/>
  </svg>`;
}

/* ============================================================
   VIDEOS: LAZY PLAY
   ============================================================ */
function wireVideos(){
  const vids = Array.from(document.querySelectorAll(".tile video"));
  state.videoObserver = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      const v = entry.target;
      if (entry.isIntersecting){
        if (!v.src && v.dataset.src){
          v.src = v.dataset.src;
          v.addEventListener("loadedmetadata", () => {
            try { v.currentTime = Math.random() * (v.duration || 0); } catch(e){}
            v.classList.add("ready");
          }, {once:true});
          v.addEventListener("error", () => showFallback(v), {once:true});
        }
        const p = v.play();
        if (p && p.catch) p.catch(() => {/* autoplay block ignored */});
      } else {
        try { v.pause(); } catch(e){}
      }
    });
  }, {threshold:0.08, rootMargin:"80px"});
  vids.forEach(v => {
    if (!v.dataset.src || v.dataset.src === "null" || v.dataset.src === ""){
      showFallback(v);
      return;
    }
    state.videoObserver.observe(v);
  });
}
function showFallback(v){
  v.style.display = "none";
  const fb = v.parentElement?.querySelector(".fallback");
  if (fb) fb.hidden = false;
}

/* ============================================================
   TICKER
   ============================================================ */
function renderTicker(){
  const track = $("tickerTrack");
  const parts = buildTickerParts();
  // Repeat twice for seamless loop (animation translates -50%)
  const one = parts.map(p => p.html).join('<span class="sep">//</span>');
  track.innerHTML = one + '<span class="sep">//</span>' + one;
}
function buildTickerParts(){
  if (state.mode === "operator"){
    const parts = [];
    const mrr = state.pnl?.overall?.income_total ?? 0;
    let rentOwed = 0;
    if (state.rent?.tenants){
      rentOwed = state.rent.tenants.reduce((s,t) => s + (Number(t.rent_owed_mtd) || 0), 0);
    }
    const occ = state.rent?.occupancy_pct
      ?? state.agents?.agents?.find(a => a.id === "brix")?.stats?.occupancy_pct
      ?? 0;
    const burn = state.pnl?.overall?.cost_total ?? 0;
    const day = Math.max(1, new Date().getDate());
    const dailyBurn = burn / day;
    const maxAgent = state.agents?.agents?.find(a => a.id === "max");
    const credits = maxAgent?.stats?.netlify_credits_remaining ?? "--";
    const echoAgent = state.agents?.agents?.find(a => a.id === "echo");
    const prospects = echoAgent?.stats?.prospects_scraped ?? 0;
    const outreach = echoAgent?.stats?.outreach_sent ?? 0;

    parts.push({html:`<span class="accent">MRR</span> ${esc(fmtMoney(mrr))}`});
    parts.push({html:`<span class="accent">RENT OWED</span> ${esc(fmtMoney(rentOwed))}`});
    parts.push({html:`<span class="accent">OCCUPANCY</span> ${esc(fmtPct(occ))}`});
    parts.push({html:`<span class="accent">DAILY BURN</span> ${esc(fmtMoney(dailyBurn))}`});
    parts.push({html:`<span class="accent">NETLIFY CREDITS</span> ${esc(String(credits))}`});
    parts.push({html:`<span class="accent">PROSPECTS</span> ${esc(fmtNum(prospects))}`});
    parts.push({html:`<span class="accent">OUTREACH SENT</span> ${esc(fmtNum(outreach))}`});
    return parts;
  } else {
    return PUBLIC_TICKER.map(s => ({html:`<span class="accent">${esc(s)}</span>`}));
  }
}

/* ============================================================
   BADGES
   ============================================================ */
function renderBadges(){
  const host = $("opBadges");
  host.innerHTML = "";
  if (state.mode !== "operator") return;
  const hank = state.agents?.agents?.find(a => a.id === "hank");
  const echo = state.agents?.agents?.find(a => a.id === "echo");
  const doss = state.agents?.agents?.find(a => a.id === "doss");
  const pitches = Number(hank?.incubator_pitches_count) || 0;
  if (pitches > 0){
    const b = document.createElement("span");
    b.className = "op-badge";
    b.title = "Hank pitches waiting";
    b.textContent = String(pitches);
    host.appendChild(b);
  }
  if (echo?.hot_leads_present === true){
    const b = document.createElement("span");
    b.className = "op-badge dot";
    b.title = "ECHO has hot leads";
    host.appendChild(b);
  }
  if (doss?.unlock_threshold_fired === true){
    const b = document.createElement("span");
    b.className = "op-badge gold";
    b.title = "DOSS unlock threshold fired";
    b.textContent = "\u2605";
    host.appendChild(b);
  }
}

/* ============================================================
   DETAIL PANEL
   ============================================================ */
function openPanel(agent){
  state.selectedId = agent.id;
  const p = $("panelContent");
  p.innerHTML = renderPanel(agent);
  $("panel").classList.add("open");
  $("panel").setAttribute("aria-hidden","false");
  const upBtn = p.querySelector(".up-toggle");
  if (upBtn){
    upBtn.addEventListener("click", () => {
      const box = p.querySelector(".up-body");
      if (!box) return;
      box.hidden = !box.hidden;
      upBtn.textContent = box.hidden ? "SHOW UPGRADE" : "HIDE UPGRADE";
    });
  }
}
function closePanel(){
  $("panel").classList.remove("open");
  $("panel").setAttribute("aria-hidden","true");
  state.selectedId = null;
}

function renderPanel(agent){
  const name = esc(agent.name || "");
  const role = esc(agent.role || "");
  const bio = esc(agent.public_bio || "");
  let html = `
    <div class="panel-name">${name}</div>
    <div class="panel-role">${role}</div>
    <div class="panel-divider" style="background:${esc(agent.color || "#c9a84c")}"></div>
    <div class="panel-bio">${bio}</div>
  `;

  if (state.mode !== "operator") return html;

  // Operator-only sections
  if (agent.mission){
    html += `
      <div class="panel-section op">
        <div class="k">MISSION</div>
        <div class="v panel-mission">${esc(agent.mission)}</div>
      </div>`;
  }
  if (agent.current_task){
    html += `
      <div class="panel-section op">
        <div class="k">CURRENT TASK</div>
        <div class="panel-task">${esc(agent.current_task)}</div>
      </div>`;
  }
  if (agent.stats && Object.keys(agent.stats).length){
    let rows = "";
    Object.entries(agent.stats).forEach(([k, v]) => {
      let val;
      if (v === null || v === undefined) val = "n/a";
      else if (typeof v === "number") val = fmtNum(v);
      else if (typeof v === "boolean") val = v ? "YES" : "NO";
      else val = esc(String(v));
      rows += `<span class="sk">${esc(humanKey(k))}</span><span class="sv">${val}</span>`;
    });
    html += `
      <div class="panel-section op">
        <div class="k">STATS</div>
        <div class="panel-stats">${rows}</div>
      </div>`;
  }
  // Skill, bay, cost
  const chips = [];
  if (agent.skill_type) chips.push(`<span class="panel-chip">${esc(humanKey(agent.skill_type))}</span>`);
  if (agent.bay_status) chips.push(`<span class="panel-chip${agent.bay_status==="locked"?" locked":""}">${esc(humanKey(agent.bay_status))}</span>`);
  if (agent.monthly_cost !== undefined && agent.monthly_cost !== null){
    const v = Number(agent.monthly_cost);
    chips.push(`<span class="panel-chip cost">$${v}/MO</span>`);
  }
  if (agent.skill){
    html += `
      <div class="panel-section op">
        <div class="k">SKILL</div>
        <div class="v">${esc(agent.skill)}</div>
        <div style="margin-top:10px">${chips.join("")}</div>
      </div>`;
  } else if (chips.length){
    html += `
      <div class="panel-section op">
        <div class="k">STATUS</div>
        <div>${chips.join("")}</div>
      </div>`;
  }
  // Install notes
  if (agent.install_notes){
    html += `
      <div class="panel-section op">
        <div class="k">INSTALL NOTES</div>
        <div class="v">${esc(agent.install_notes)}</div>
      </div>`;
  }
  // Upgrade parked
  if (agent.upgrade_summary || agent.upgrade_pitch_path){
    const thresh = agent.upgrade_available_at_revenue ? `AT $${fmtNum(agent.upgrade_available_at_revenue)} MRR` : "";
    html += `
      <div class="panel-section op">
        <button class="btn ghost up-toggle" type="button">SHOW UPGRADE</button>
        <div class="up-body panel-upgrade" hidden>
          <div><strong>${esc(thresh)}</strong></div>
          <div style="margin-top:6px">${esc(agent.upgrade_summary || "")}</div>
          ${agent.upgrade_pitch_path ? `<div class="panel-kvrow"><span class="k2">PITCH</span><span class="v2">${esc(agent.upgrade_pitch_path)}</span></div>` : ""}
        </div>
      </div>`;
  }
  // Upside tier (MAX)
  if (agent.upside_tier){
    const t = agent.upside_tier;
    html += `
      <div class="panel-section op">
        <div class="k">UPSIDE TIER</div>
        <div class="v"><strong>${esc(t.name || "")}</strong> ${t.price_mo ? `$${Number(t.price_mo)}/MO` : ""}</div>
        ${t.stack ? `<div class="v" style="margin-top:4px;color:var(--text-2)">${esc(t.stack)}</div>` : ""}
        ${t.blocker ? `<div class="panel-kvrow"><span class="k2">BLOCKER</span><span class="v2">${esc(t.blocker)}</span></div>` : ""}
      </div>`;
  }
  return html;
}

/* ============================================================
   MODE SWAP
   ============================================================ */
function applyMode(){
  document.body.classList.toggle("operator-mode", state.mode === "operator");
  document.body.classList.toggle("public-mode", state.mode === "public");
  renderTicker();
  renderBadges();
  if (state.selectedId){
    const a = state.agents.agents.find(x => x.id === state.selectedId);
    if (a){ $("panelContent").innerHTML = renderPanel(a); }
  }
}

function enterOperator(){
  state.mode = "operator";
  sessionStorage.setItem("by_op", "1");
  applyMode();
  $("modeFlash").classList.remove("fire");
  void $("modeFlash").offsetWidth;
  $("modeFlash").classList.add("fire");
}
function exitOperator(){
  state.mode = "public";
  sessionStorage.removeItem("by_op");
  applyMode();
}

/* ============================================================
   UNLOCK FLOW
   ============================================================ */
function showUnlock(){
  $("overlay").classList.add("open");
  $("unlockInput").value = "";
  $("unlockErr").classList.remove("show");
  setTimeout(() => $("unlockInput").focus(), 120);
}
function hideUnlock(){
  $("overlay").classList.remove("open");
}
async function tryUnlock(e){
  e.preventDefault();
  const input = $("unlockInput");
  const hash = await sha256(input.value);
  if (hash === OPERATOR_HASH){
    hideUnlock();
    enterOperator();
  } else {
    input.classList.remove("shake");
    void input.offsetWidth;
    input.classList.add("shake");
    input.value = "";
    $("unlockErr").classList.add("show");
  }
}

/* ============================================================
   EVENTS
   ============================================================ */
function wireEvents(){
  document.addEventListener("keydown", (e) => {
    const tag = (e.target?.tagName || "").toLowerCase();
    const inField = tag === "input" || tag === "textarea" || e.target?.isContentEditable;
    const keyO = e.key === "O" || e.key === "o" || e.code === "KeyO";
    if (e.ctrlKey && e.shiftKey && keyO){
      e.preventDefault();
      if (state.mode === "operator"){
        if (confirm("Return to public view?")) exitOperator();
      } else if (!inField){
        showUnlock();
      }
      return;
    }
    if (e.key === "Escape"){
      if ($("overlay").classList.contains("open")) hideUnlock();
      else if ($("panel").classList.contains("open")) closePanel();
    }
  });

  $("opIndicator").addEventListener("click", () => {
    if (confirm("Return to public view?")) exitOperator();
  });
  $("unlockForm").addEventListener("submit", tryUnlock);
  $("unlockCancel").addEventListener("click", hideUnlock);
  $("overlay").addEventListener("click", (e) => {
    if (e.target === $("overlay")) hideUnlock();
  });
  $("panelClose").addEventListener("click", closePanel);
  document.addEventListener("click", (e) => {
    const panel = $("panel");
    if (!panel.classList.contains("open")) return;
    if (panel.contains(e.target)) return;
    if (e.target.closest?.(".tile")) return;
    closePanel();
  });
  window.addEventListener("focus", () => { if (state.mode === "operator") renderTicker(); });
}

/* ============================================================
   FATAL
   ============================================================ */
function renderFatal(msg){
  const host = document.createElement("div");
  host.className = "fatal";
  host.innerHTML = `<div class="card"><h3>YARD OFFLINE</h3><p>${esc(msg)}</p></div>`;
  $("cockpit").appendChild(host);
  $("stage").style.display = "none";
  $("ticker").style.display = "none";
}

/* ============================================================
   BOOT
   ============================================================ */
async function boot(){
  bootChrome();
  await fetchAll();
  if (!validateAgents()){
    renderFatal("agents.json failed to load or is malformed");
    return;
  }
  document.body.classList.toggle("operator-mode", state.mode === "operator");
  document.body.classList.toggle("public-mode", state.mode === "public");
  renderWalls();
  wireVideos();
  renderTicker();
  renderBadges();
  wireEvents();
  requestAnimationFrame(() => document.body.classList.remove("loading"));
}
boot();
