<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Brewington Yard — Command Center</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0a0a;
    --bg-2: #111111;
    --panel: #141414;
    --panel-2: #1a1a1a;
    --stroke: #242424;
    --stroke-2: #2f2f2f;
    --gold: #c9a24b;
    --gold-dim: #8c6f33;
    --bone: #e8e4d8;
    --text: #e8e4d8;
    --text-dim: #8a867c;
    --cyan: #00e5ff;
    --cyan-dim: #0a7686;
    --red: #d64545;
    --green: #6fae6f;
    --amber: #e0a94a;
    --vacant: #3a3a3a;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    background: var(--bg);
    color: var(--text);
    font-family: 'JetBrains Mono', ui-monospace, monospace;
    height: 100%;
    overflow: hidden;
    image-rendering: pixelated;
  }

  body {
    display: flex;
    flex-direction: column;
    background:
      radial-gradient(ellipse at top, #141414 0%, #0a0a0a 60%) fixed;
  }

  /* ====================== HUD STRIP ====================== */
  .hud {
    flex: 0 0 auto;
    height: 62px;
    border-bottom: 1px solid var(--stroke);
    background: linear-gradient(180deg, #141414, #0d0d0d);
    display: flex;
    align-items: stretch;
    padding: 0 18px;
    font-size: 11px;
    position: relative;
    z-index: 10;
  }
  .hud::after {
    content: '';
    position: absolute;
    left: 0; right: 0; bottom: -1px;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--gold) 50%, transparent);
    opacity: 0.4;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 12px;
    padding-right: 18px;
    border-right: 1px solid var(--stroke);
    margin-right: 18px;
  }
  .brand-mark {
    width: 32px; height: 32px;
    border: 1px solid var(--gold);
    display: grid;
    place-items: center;
    color: var(--gold);
    font-family: 'Press Start 2P', monospace;
    font-size: 14px;
    background: #0a0a0a;
  }
  .brand-name {
    font-family: 'Press Start 2P', monospace;
    font-size: 10px;
    letter-spacing: 1.5px;
    color: var(--bone);
    line-height: 1.5;
  }
  .brand-sub {
    font-size: 9px;
    color: var(--text-dim);
    letter-spacing: 1.5px;
    margin-top: 3px;
    text-transform: uppercase;
  }

  .hud-stats {
    display: flex;
    align-items: center;
    gap: 14px;
    flex: 1;
    overflow-x: auto;
  }
  .stat {
    padding: 4px 12px;
    border: 1px solid var(--stroke);
    background: #0d0d0d;
    min-width: 110px;
    position: relative;
  }
  .stat-label {
    font-size: 8px;
    letter-spacing: 1.5px;
    color: var(--text-dim);
    text-transform: uppercase;
    margin-bottom: 3px;
  }
  .stat-value {
    font-family: 'Press Start 2P', monospace;
    font-size: 12px;
    color: var(--bone);
  }
  .stat-value.pos { color: var(--green); }
  .stat-value.neg { color: var(--red); }
  .stat-value.cyan { color: var(--cyan); }
  .stat-value.gold { color: var(--gold); }

  .hud-clock {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    justify-content: center;
    min-width: 180px;
    padding-left: 18px;
    border-left: 1px solid var(--stroke);
  }
  .hud-clock-date {
    font-size: 9px;
    color: var(--text-dim);
    letter-spacing: 2px;
    text-transform: uppercase;
  }
  .hud-clock-time {
    font-family: 'Press Start 2P', monospace;
    font-size: 14px;
    color: var(--gold);
    margin-top: 4px;
  }

  /* ====================== GRID ====================== */
  .stage {
    flex: 1 1 auto;
    position: relative;
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    grid-template-rows: repeat(4, 1fr);
    gap: 18px;
    padding: 18px;
    min-height: 0;
    background:
      /* vertical gold hairlines at column boundaries */
      linear-gradient(90deg, transparent calc(20% - 1px), rgba(201,162,75,0.45) calc(20% - 0.5px), rgba(201,162,75,0.65) 20%, rgba(201,162,75,0.45) calc(20% + 0.5px), transparent calc(20% + 1px)),
      linear-gradient(90deg, transparent calc(40% - 1px), rgba(201,162,75,0.45) calc(40% - 0.5px), rgba(201,162,75,0.65) 40%, rgba(201,162,75,0.45) calc(40% + 0.5px), transparent calc(40% + 1px)),
      linear-gradient(90deg, transparent calc(60% - 1px), rgba(201,162,75,0.45) calc(60% - 0.5px), rgba(201,162,75,0.65) 60%, rgba(201,162,75,0.45) calc(60% + 0.5px), transparent calc(60% + 1px)),
      linear-gradient(90deg, transparent calc(80% - 1px), rgba(201,162,75,0.45) calc(80% - 0.5px), rgba(201,162,75,0.65) 80%, rgba(201,162,75,0.45) calc(80% + 0.5px), transparent calc(80% + 1px)),
      /* horizontal gold hairlines at row boundaries */
      linear-gradient(180deg, transparent calc(25% - 1px), rgba(201,162,75,0.45) calc(25% - 0.5px), rgba(201,162,75,0.65) 25%, rgba(201,162,75,0.45) calc(25% + 0.5px), transparent calc(25% + 1px)),
      linear-gradient(180deg, transparent calc(50% - 1px), rgba(201,162,75,0.45) calc(50% - 0.5px), rgba(201,162,75,0.65) 50%, rgba(201,162,75,0.45) calc(50% + 0.5px), transparent calc(50% + 1px)),
      linear-gradient(180deg, transparent calc(75% - 1px), rgba(201,162,75,0.45) calc(75% - 0.5px), rgba(201,162,75,0.65) 75%, rgba(201,162,75,0.45) calc(75% + 0.5px), transparent calc(75% + 1px)),
      /* metal corridor base — brushed vertical sheen */
      repeating-linear-gradient(90deg, #1b1b1b 0, #1b1b1b 1px, #161616 1px, #161616 3px),
      linear-gradient(180deg, #1a1a1a, #0f0f0f);
  }

  /* corridor edge shadow on each tile to simulate doorway depth */
  .tile {
    box-shadow:
      0 0 0 1px #0a0a0a,
      0 0 6px rgba(0,0,0,0.6);
  }

  .tile {
    position: relative;
    background: #0a0a0a;
    border: 1px solid var(--stroke);
    overflow: hidden;
    cursor: pointer;
    transition: border-color 0.15s, transform 0.15s;
    display: flex;
    flex-direction: column;
  }
  .tile:hover {
    border-color: var(--gold);
    z-index: 3;
  }
  .tile.active {
    border-color: var(--cyan);
    box-shadow: inset 0 0 0 1px var(--cyan);
  }

  .tile-img {
    position: absolute;
    inset: 0;
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    image-rendering: pixelated;
  }
  .tile::before {
    content: '';
    position: absolute;
    inset: 0;
    background:
      linear-gradient(180deg, rgba(10,10,10,0.1) 0%, rgba(10,10,10,0.55) 55%, rgba(10,10,10,0.9) 100%);
    pointer-events: none;
    z-index: 1;
  }
  .tile::after {
    /* top-right watermark cover — the source art carries a corner watermark */
    content: '';
    position: absolute;
    top: 0; right: 0;
    width: 70px; height: 24px;
    background: linear-gradient(180deg, rgba(10,10,10,0.92), rgba(10,10,10,0));
    pointer-events: none;
    z-index: 2;
  }

  .tile-header {
    position: relative;
    z-index: 3;
    padding: 7px 9px 6px;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 6px;
  }
  .tile-badge {
    font-family: 'Press Start 2P', monospace;
    font-size: 7px;
    letter-spacing: 1px;
    padding: 3px 5px;
    border: 1px solid;
    background: rgba(10,10,10,0.75);
    white-space: nowrap;
  }
  .tile-badge.live { color: var(--green); border-color: var(--green); }
  .tile-badge.live::before {
    content: '';
    display: inline-block;
    width: 5px; height: 5px;
    background: var(--green);
    margin-right: 4px;
    vertical-align: middle;
    animation: pulse 1.6s infinite;
  }
  .tile-badge.idle { color: var(--text-dim); border-color: var(--stroke-2); }
  .tile-badge.warn { color: var(--amber); border-color: var(--amber); }
  .tile-badge.crit { color: var(--red); border-color: var(--red); }
  .tile-badge.sys  { color: var(--cyan); border-color: var(--cyan); }
  .tile-badge.rent { color: var(--gold); border-color: var(--gold); }

  .tile-id {
    font-size: 8px;
    color: var(--gold);
    letter-spacing: 1.5px;
    text-transform: uppercase;
    font-family: 'Press Start 2P', monospace;
  }

  .tile-footer {
    position: relative;
    z-index: 3;
    margin-top: auto;
    padding: 8px 9px 9px;
  }
  .tile-name {
    font-family: 'Press Start 2P', monospace;
    font-size: 11px;
    color: var(--bone);
    letter-spacing: 0.5px;
    line-height: 1.2;
  }
  .tile-role {
    font-size: 9px;
    color: var(--gold);
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-top: 4px;
  }
  .tile-task {
    font-size: 10px;
    color: var(--text);
    margin-top: 6px;
    opacity: 0.85;
    line-height: 1.4;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  .tile-bar {
    margin-top: 7px;
    height: 4px;
    background: #1a1a1a;
    border: 1px solid var(--stroke);
    position: relative;
    overflow: hidden;
  }
  .tile-bar-fill {
    position: absolute;
    top: 0; bottom: 0;
    left: 0;
    background: linear-gradient(90deg, var(--gold-dim), var(--gold));
    transition: width 0.5s ease;
  }
  .tile-bar-fill.crit { background: linear-gradient(90deg, #6b2323, var(--red)); }
  .tile-bar-fill.warn { background: linear-gradient(90deg, #7a5a1d, var(--amber)); }
  .tile-bar-fill.cyan { background: linear-gradient(90deg, var(--cyan-dim), var(--cyan)); }
  .tile-bar-fill.green{ background: linear-gradient(90deg, #2a5a2a, var(--green)); }

  .tile-meta {
    margin-top: 6px;
    display: flex;
    justify-content: space-between;
    gap: 8px;
    font-size: 8px;
    color: var(--text-dim);
    letter-spacing: 1px;
    text-transform: uppercase;
  }
  .tile-meta strong {
    color: var(--bone);
    font-weight: 500;
  }

  /* Vacant tile variant */
  .tile.vacant {
    background:
      repeating-linear-gradient(45deg, #0a0a0a 0px, #0a0a0a 8px, #141414 8px, #141414 16px);
  }
  .tile.vacant::before { display: none; }
  .tile.vacant::after { display: none; }
  .tile.vacant .tile-footer {
    text-align: center;
    padding: 0 14px;
  }
  .tile.vacant .tile-name {
    color: var(--gold);
    font-size: 12px;
  }
  .tile.vacant .tile-role {
    color: var(--text-dim);
  }
  .tile.vacant .vacant-core {
    position: relative;
    z-index: 3;
    flex: 1;
    display: grid;
    place-items: center;
    padding: 18px;
    text-align: center;
  }
  .tile.vacant .vacant-mark {
    border: 2px solid var(--gold);
    padding: 10px 16px;
    font-family: 'Press Start 2P', monospace;
    font-size: 10px;
    letter-spacing: 2px;
    color: var(--gold);
  }

  /* ====================== LIVE FEED ====================== */
  .feed {
    flex: 0 0 auto;
    height: 92px;
    border-top: 1px solid var(--stroke);
    background: #0d0d0d;
    padding: 6px 14px;
    display: flex;
    flex-direction: column;
  }
  .feed::before {
    content: '';
    position: absolute;
    left: 0; right: 0;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--cyan) 50%, transparent);
    opacity: 0.35;
  }
  .feed-header {
    display: flex;
    justify-content: space-between;
    font-size: 8px;
    letter-spacing: 2px;
    color: var(--text-dim);
    text-transform: uppercase;
    padding-bottom: 4px;
    border-bottom: 1px solid var(--stroke);
    flex: 0 0 auto;
  }
  .feed-header strong {
    color: var(--cyan);
    font-weight: 500;
  }
  .feed-list {
    flex: 1;
    overflow-y: auto;
    overflow-x: hidden;
    font-size: 10px;
    padding: 4px 0 0;
  }
  .feed-list::-webkit-scrollbar { width: 4px; }
  .feed-list::-webkit-scrollbar-thumb { background: var(--stroke-2); }
  .feed-row {
    display: grid;
    grid-template-columns: 90px 90px 1fr;
    gap: 12px;
    padding: 2px 0;
    border-bottom: 1px dashed #1a1a1a;
    white-space: nowrap;
  }
  .feed-ts { color: var(--text-dim); font-size: 9px; }
  .feed-agent {
    color: var(--gold);
    font-size: 9px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
  }
  .feed-text {
    color: var(--text);
    overflow: hidden;
    text-overflow: ellipsis;
  }

  /* ====================== SIDEBAR ====================== */
  .sidebar {
    position: fixed;
    top: 0; right: 0; bottom: 0;
    width: 460px;
    max-width: 92vw;
    background: #0d0d0d;
    border-left: 1px solid var(--gold);
    transform: translateX(100%);
    transition: transform 0.28s cubic-bezier(.3,.7,.3,1);
    z-index: 50;
    display: flex;
    flex-direction: column;
    box-shadow: -12px 0 48px rgba(0,0,0,0.6);
  }
  .sidebar.open { transform: translateX(0); }

  .sidebar-head {
    padding: 20px 22px 14px;
    border-bottom: 1px solid var(--stroke);
    background: linear-gradient(180deg, #161616, #0d0d0d);
    position: relative;
  }
  .sidebar-close {
    position: absolute;
    top: 16px; right: 18px;
    width: 28px; height: 28px;
    border: 1px solid var(--stroke);
    background: transparent;
    color: var(--text-dim);
    cursor: pointer;
    font-size: 16px;
    line-height: 1;
    font-family: inherit;
  }
  .sidebar-close:hover { color: var(--gold); border-color: var(--gold); }

  .sidebar-bayid {
    font-size: 9px;
    color: var(--gold);
    letter-spacing: 2px;
    text-transform: uppercase;
    font-family: 'Press Start 2P', monospace;
    margin-bottom: 6px;
  }
  .sidebar-title {
    font-family: 'Press Start 2P', monospace;
    font-size: 18px;
    color: var(--bone);
    line-height: 1.3;
  }
  .sidebar-role {
    font-size: 11px;
    color: var(--text-dim);
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-top: 6px;
  }
  .sidebar-status-row {
    display: flex;
    gap: 8px;
    margin-top: 12px;
    flex-wrap: wrap;
  }
  .chip {
    font-family: 'Press Start 2P', monospace;
    font-size: 8px;
    padding: 4px 7px;
    border: 1px solid;
    letter-spacing: 1px;
  }
  .chip.live { color: var(--green); border-color: var(--green); }
  .chip.idle { color: var(--text-dim); border-color: var(--stroke-2); }
  .chip.warn { color: var(--amber); border-color: var(--amber); }
  .chip.crit { color: var(--red); border-color: var(--red); }
  .chip.cyan { color: var(--cyan); border-color: var(--cyan); }

  .sidebar-body {
    flex: 1;
    overflow-y: auto;
    padding: 18px 22px 60px;
    font-size: 12px;
    line-height: 1.6;
  }
  .sidebar-body::-webkit-scrollbar { width: 4px; }
  .sidebar-body::-webkit-scrollbar-thumb { background: var(--stroke-2); }
  .section {
    margin-top: 20px;
  }
  .section:first-child { margin-top: 0; }
  .section h4 {
    font-family: 'Press Start 2P', monospace;
    font-size: 9px;
    color: var(--gold);
    letter-spacing: 2px;
    margin-bottom: 8px;
    padding-bottom: 6px;
    border-bottom: 1px solid var(--stroke);
    text-transform: uppercase;
    font-weight: 500;
  }
  .kv {
    display: grid;
    grid-template-columns: 110px 1fr;
    gap: 6px 12px;
    font-size: 11px;
  }
  .kv dt {
    color: var(--text-dim);
    letter-spacing: 1px;
    text-transform: uppercase;
    font-size: 9px;
    padding-top: 2px;
  }
  .kv dd { color: var(--text); }
  .kv dd.pos { color: var(--green); }
  .kv dd.neg { color: var(--red); }
  .kv dd.gold { color: var(--gold); }

  .blockquote {
    border-left: 2px solid var(--gold);
    padding: 4px 12px;
    color: var(--text);
    font-size: 11px;
    line-height: 1.65;
    background: rgba(201,162,75,0.04);
  }

  .log-list { font-size: 11px; }
  .log-list li {
    list-style: none;
    padding: 5px 0;
    border-bottom: 1px dashed #1a1a1a;
    color: var(--text);
  }
  .log-list li:last-child { border-bottom: none; }
  .log-list .log-ts { color: var(--text-dim); font-size: 9px; margin-right: 8px; }

  .sidebar-scrim {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.55);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s;
    z-index: 49;
  }
  .sidebar-scrim.open { opacity: 1; pointer-events: auto; }

  /* ====================== ANIMATIONS ====================== */
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.25; }
  }
  @keyframes scan {
    0% { transform: translateY(-100%); }
    100% { transform: translateY(200%); }
  }
  .tile.live-scan::before {
    animation: none;
  }
  .tile.live-scan .scan-line {
    position: absolute;
    left: 0; right: 0;
    height: 2px;
    background: linear-gradient(90deg, transparent, var(--cyan), transparent);
    opacity: 0.2;
    animation: scan 3.5s linear infinite;
    pointer-events: none;
    z-index: 2;
  }

  /* ====================== AGENT SPRITES ====================== */
  .sprite {
    position: absolute;
    z-index: 2;
    font-size: 16px;
    line-height: 1;
    filter: drop-shadow(0 2px 3px rgba(0,0,0,0.75)) drop-shadow(0 0 6px rgba(201,162,75,0.35));
    user-select: none;
    pointer-events: none;
    animation-duration: var(--sprite-duration, 6s);
    animation-timing-function: linear;
    animation-iteration-count: infinite;
    will-change: left, top, transform;
  }

  /* Jax — walks back and forth between desk and wall */
  .sprite.walk-jax {
    animation-name: walk-jax;
    top: 62%;
  }
  @keyframes walk-jax {
    0%        { left: 22%; transform: scaleX(1)   translateY(0); }
    45%       { left: 72%; transform: scaleX(1)   translateY(0); }
    47%       { left: 72%; transform: scaleX(-1)  translateY(0); }
    50%       { left: 72%; transform: scaleX(-1)  translateY(-2px); }
    95%       { left: 22%; transform: scaleX(-1)  translateY(0); }
    97%, 100% { left: 22%; transform: scaleX(1)   translateY(0); }
  }

  /* Hank — paces a small circle around his workbench */
  .sprite.walk-hank {
    animation-name: walk-hank;
  }
  @keyframes walk-hank {
    0%   { left: 38%; top: 50%; }
    25%  { left: 60%; top: 52%; }
    50%  { left: 62%; top: 72%; }
    75%  { left: 38%; top: 72%; }
    100% { left: 38%; top: 50%; }
  }

  /* Vega — sits and bobs while typing */
  .sprite.walk-vega {
    animation-name: walk-vega;
    left: 46%;
    top: 58%;
  }
  @keyframes walk-vega {
    0%,100% { transform: translateY(0)   rotate(-3deg); }
    50%     { transform: translateY(-3px) rotate(3deg); }
  }

  /* Brix — crawls along the floor checking cables */
  .sprite.walk-brix {
    animation-name: walk-brix;
    top: 74%;
    font-size: 14px;
  }
  @keyframes walk-brix {
    0%        { left: 18%; transform: scaleX(1)  translateY(0); }
    48%       { left: 78%; transform: scaleX(1)  translateY(-1px); }
    50%       { left: 78%; transform: scaleX(-1) translateY(0); }
    98%       { left: 18%; transform: scaleX(-1) translateY(-1px); }
    100%      { left: 18%; transform: scaleX(1)  translateY(0); }
  }

  /* Doss — stands and rotates scanning the vault */
  .sprite.walk-doss {
    animation-name: walk-doss;
    left: 46%;
    top: 60%;
  }
  @keyframes walk-doss {
    0%   { transform: rotate(0deg); }
    50%  { transform: rotate(180deg); }
    100% { transform: rotate(360deg); }
  }

  /* Vault — counts coins, hand pulses */
  .sprite.walk-vault {
    animation-name: walk-vault;
    left: 50%;
    top: 60%;
  }
  @keyframes walk-vault {
    0%, 100% { transform: translateY(0)   scale(1); }
    50%      { transform: translateY(-4px) scale(1.15); }
  }

  /* Ambient: bob (float in place) */
  .sprite.ambient-bob {
    animation-name: ambient-bob;
    left: 46%;
    top: 56%;
  }
  @keyframes ambient-bob {
    0%,100% { transform: translateY(0); }
    50%     { transform: translateY(-3px); }
  }

  /* Ambient: slow rotate (radar / watch tower) */
  .sprite.ambient-rotate {
    animation-name: ambient-rotate;
    left: 46%;
    top: 58%;
  }
  @keyframes ambient-rotate {
    0%   { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
  }

  /* Ambient: walk (linear traversal) */
  .sprite.ambient-walk {
    animation-name: ambient-walk;
    top: 64%;
  }
  @keyframes ambient-walk {
    0%        { left: 22%; transform: scaleX(1); }
    48%       { left: 72%; transform: scaleX(1); }
    50%       { left: 72%; transform: scaleX(-1); }
    98%       { left: 22%; transform: scaleX(-1); }
    100%      { left: 22%; transform: scaleX(1); }
  }

  /* Ambient: pulse (scale in place) */
  .sprite.ambient-pulse {
    animation-name: ambient-pulse;
    left: 48%;
    top: 58%;
  }
  @keyframes ambient-pulse {
    0%, 100% { transform: scale(1);   filter: drop-shadow(0 0 2px rgba(0,229,255,0.3)); }
    50%      { transform: scale(1.18);filter: drop-shadow(0 0 6px rgba(0,229,255,0.7)); }
  }

  /* ====================== CONNECTION PULSES ====================== */
  .conn-layer {
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 5;
  }
  .conn-pulse {
    position: absolute;
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--cyan);
    box-shadow:
      0 0 14px 2px var(--cyan),
      0 0 4px var(--cyan);
    opacity: 0;
    animation-iteration-count: infinite;
    animation-timing-function: ease-in-out;
    will-change: left, top, opacity;
  }
  .conn-pulse.gold {
    background: var(--gold);
    box-shadow:
      0 0 14px 2px var(--gold),
      0 0 4px var(--gold);
  }
  .conn-pulse.red {
    background: var(--red);
    box-shadow: 0 0 14px 2px var(--red), 0 0 4px var(--red);
  }

  /* Grid-cell-center helper percentages:
     cols 1..5 -> x = 10, 30, 50, 70, 90
     rows 1..4 -> y = 12.5, 37.5, 62.5, 87.5 */

  /* Jax (7: 30,37.5) -> Hank (8: 50,37.5) — build request */
  @keyframes flow-jax-hank {
    0%   { left: 30%; top: 37.5%; opacity: 0; }
    10%  { opacity: 1; }
    90%  { opacity: 1; }
    100% { left: 50%; top: 37.5%; opacity: 0; }
  }
  .conn-pulse.ch-jax-hank { animation-name: flow-jax-hank; animation-duration: 3.8s; }

  /* Hank (8) -> Jax (7) — tool installed */
  @keyframes flow-hank-jax {
    0%   { left: 50%; top: 37.5%; opacity: 0; }
    10%  { opacity: 1; }
    90%  { opacity: 1; }
    100% { left: 30%; top: 37.5%; opacity: 0; }

/* ============= HELPERS ============= */
function fmtMoney(n) {
  n = Number(n || 0);
  if (n === 0) return '$0';
  const abs = Math.abs(n);
  if (abs >= 1000) return (n < 0 ? '-' : '') + '$' + (abs / 1000).toFixed(1) + 'k';
  return (n < 0 ? '-' : '') + '$' + abs.toFixed(0);
}
function fmtTimeAgo(iso) {
  if (!iso) return '—';
  const ms = Date.now() - new Date(iso).getTime();
  if (isNaN(ms)) return '—';
  if (ms < 60_000) return Math.floor(ms / 1000) + 's ago';
  if (ms < 3_600_000) return Math.floor(ms / 60_000) + 'm ago';
  if (ms < 86_400_000) return Math.floor(ms / 3_600_000) + 'h ago';
  return Math.floor(ms / 86_400_000) + 'd ago';
}
function escapeHtml(s) {
  if (s == null) return '';
  return String(s).replace(/[&<>"']/g, c => ({
    '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;'
  }[c]));
}

/* ============= STATE ============= */

      `;
    } else {

      const spriteHTML = sp
        ? `<span class="sprite ${sp.anim}" style="--sprite-duration:${sp.base}s;">${sp.glyph}</span>`
        : '';
      tile.innerHTML = `

          <div class="tile-meta" data-role="meta">
            <span>—</span><span>—</span>
          </div>
        </div>
      `;
    }
    tile.addEventListener('click', () => openSidebar(room));
    stage.appendChild(tile);
  }
}

/* ============= UPDATE TILE DATA ============= */
function updateTile(room) {
  const tile = document.querySelector(`.tile[data-slot="${room.slot}"]`);
  if (!tile || room.kind === 'vacant') return;

  const badge = tile.querySelector('[data-role="badge"]');
  const task  = tile.querySelector('[data-role="task"]');
  const bar   = tile.querySelector('[data-role="bar"]');
  const meta  = tile.querySelector('[data-role="meta"]');
  if (!badge) return;

  if (room.kind === 'bay') {
    const b = state.byBay[room.bay];
    if (!b) return;

    // badge
    let cls = 'idle', label = 'IDLE';
    const failures = b.failures_in_row || 0;
    if (b.last_escalation_reason) { cls = 'crit'; label = 'ESCALATED'; }
    else if (failures >= 2) { cls = 'warn'; label = 'WARN'; }
    else if (b.status === 'live' || b.status === 'active' || b.status === 'ready') { cls = 'live'; label = 'LIVE'; }
    else if (b.status === 'filed') { cls = 'live'; label = 'LIVE'; }
    badge.className = 'tile-badge ' + cls;
    badge.textContent = label;

    // sprite speed: active = faster, idle/warn = slower
    const sprite = tile.querySelector('.sprite');
    const baseSp = SPRITES[room.id]?.base || 6;
    if (sprite) {
      let mult = 1;
      if (cls === 'live') mult = 0.7;       // quicker
      else if (cls === 'warn') mult = 1.3;  // plodding
      else if (cls === 'crit') mult = 0.45; // urgent
      else mult = 1.6;                      // idle -> slower
      sprite.style.setProperty('--sprite-duration', (baseSp * mult).toFixed(2) + 's');
    }

    // task line
    const taskText = b.last_tick_summary || b.mode || 'standing by';
    task.textContent = taskText;

    // progress bar: route by bay
    const bp = progressForBay(room.bay, b);
    bar.style.width = bp.pct + '%';
    bar.className = 'tile-bar-fill ' + bp.tone;

    // meta row
    const left = b.last_tick_at ? fmtTimeAgo(b.last_tick_at) : '—';
    const right = b.month_to_date
      ? `${fmtMoney(b.month_to_date.income)} / ${fmtMoney(b.month_to_date.cost)}`
      : '—';
    meta.innerHTML = `<span>${escapeHtml(left)}</span><span><strong>${escapeHtml(right)}</strong></span>`;
  } else {
    // support rooms — derive something live-ish
    const s = supportMetric(room.id);
    badge.className = 'tile-badge ' + s.badgeCls;
    badge.textContent = s.badge;
    task.textContent = s.task;
    bar.style.width = s.pct + '%';
    bar.className = 'tile-bar-fill ' + s.tone;
    meta.innerHTML = `<span>${escapeHtml(s.metaL)}</span><span><strong>${escapeHtml(s.metaR)}</strong></span>`;
  }
}

function progressForBay(name, b) {
  // derive a % and tone per bay
  if (name === 'scout') {
    const income = b.month_to_date?.income || 0;
    const target = 245;
    const pct = Math.min(100, Math.round((income / target) * 100));
    return { pct, tone: pct >= 40 ? 'green' : pct > 0 ? 'cyan' : 'warn' };
  }
  if (name === 'paymaster') {
    const income = b.month_to_date?.income || 0;
    const target = 100;
    const pct = Math.min(100, Math.round((income / target) * 100));
    return { pct, tone: pct > 0 ? 'cyan' : 'warn' };
  }
  if (name === 'realtor') {
    const re = state.realestate;
    if (re) {
      const pct = Math.min(100, Math.round((re.occupancy_pct || 0) * 100));
      return { pct, tone: pct >= 70 ? 'green' : pct >= 30 ? 'cyan' : 'warn' };
    }
    return { pct: 50, tone: 'cyan' };
  }
  if (name === 'foreman') {
    // approval ratio
    const hired = b.hired_roster?.length || 0;
    const pct = Math.min(100, hired * 14);
    return { pct, tone: 'cyan' };
  }
  if (name === 'builder') {
    // reads current_project progress loosely: if a project_id exists => 66%
    const pct = b.current_project?.project_id ? 66 : 10;
    return { pct, tone: 'warn' };
  }
  return { pct: 50, tone: 'cyan' };
}

function supportMetric(id) {
  const re = state.realestate;
  const bays = Object.values(state.byBay);
  switch (id) {
    case 'HQ-00':
      return { badge: 'STANDING', badgeCls: 'sys', task: 'yard growth supervised by Lando', pct: 100, tone: 'green', metaL: 'TENANTS', metaR: String(re?.tenants_total ?? '—') };
    case 'TER-01': {
      const pf = state.portfolio;
      return { badge: pf ? 'SCANNED' : 'LOADING', badgeCls: 'sys', task: 'phoenix metro leads indexed', pct: 80, tone: 'cyan', metaL: 'LEADS', metaR: String(pf?.total ?? '—') };
    }
    case 'RAD-02':
      return { badge: 'SWEEP', badgeCls: 'sys', task: 'traffic + mention sweep on 60s tick', pct: 65, tone: 'cyan', metaL: 'SOURCES', metaR: '6' };
    case 'DSP-04':
      return { badge: 'TICK', badgeCls: 'live', task: 'scheduler loop every 60s, all bays ticking', pct: 100, tone: 'green', metaL: 'CADENCE', metaR: '60s' };
    case 'DSN-05': {
      const bld = state.byBay.builder;
      const proj = bld?.current_project?.project_id || 'no project';
      return { badge: 'BRIEF', badgeCls: 'sys', task: proj.replace(/-/g, ' '), pct: 60, tone: 'warn', metaL: 'PROJECT', metaR: proj.split('-').pop() };
    }
    case 'AUD-08':
      return { badge: 'READY', badgeCls: 'sys', task: 'rating queue / approver live', pct: 75, tone: 'cyan', metaL: 'SCALE', metaR: 'R/Y/G/G' };
    case 'LAB-09':
      return { badge: 'READY', badgeCls: 'sys', task: 'agentQA gate on every ship', pct: 85, tone: 'green', metaL: 'GATE', metaR: 'PASS/FAIL' };
    case 'SRV-10':
      return { badge: 'WATCH', badgeCls: 'sys', task: 'gumroad + referral channels watched', pct: 60, tone: 'cyan', metaL: 'EYES', metaR: 'ON' };
    case 'NRL-11':
      return { badge: 'LEARN', badgeCls: 'sys', task: 'pattern memory updating per tick', pct: 70, tone: 'cyan', metaL: 'BRIDGE', metaR: 'HOT' };
    case 'SVR-12':
      return { badge: 'UP', badgeCls: 'live', task: 'port 3000 / SSE connected', pct: 100, tone: 'green', metaL: 'UPTIME', metaR: 'OK' };
    case 'VLT-14':
      return { badge: 'SEALED', badgeCls: 'sys', task: 'credentials and contracts locked', pct: 100, tone: 'green', metaL: 'DOOR', metaR: 'CLOSED' };
    case 'REV-16': {
      const totals = bays.reduce((a, b) => ({
        inc: a.inc + (b.month_to_date?.income || 0),
        cost: a.cost + (b.month_to_date?.cost || 0)
      }), { inc: 0, cost: 0 });
      const pct = Math.min(100, Math.round((totals.inc / 345) * 100));
      return {
        badge: totals.inc > 0 ? 'POS' : 'WAIT',
        badgeCls: totals.inc > 0 ? 'sys' : 'warn',
        task: `MTD in: ${fmtMoney(totals.inc)}   out: ${fmtMoney(totals.cost)}`,
        pct, tone: totals.inc > 0 ? 'green' : 'warn',
        metaL: 'NET', metaR: fmtMoney(totals.inc - totals.cost)
      };
    }
    default:
      return { badge: 'SYS', badgeCls: 'sys', task: 'standing by', pct: 50, tone: 'cyan', metaL: '—', metaR: '—' };
  }
}

/* ============= HUD ============= */
function renderHud() {
  const re = state.realestate;
  const bays = Object.values(state.byBay);
  const totIn  = bays.reduce((s, b) => s + (b.month_to_date?.income || 0), 0);
  const totOut = bays.reduce((s, b) => s + (b.month_to_date?.cost || 0), 0);
  const activeBays = bays.filter(b => b.status === 'live' || b.status === 'active' || b.status === 'ready' || b.status === 'filed').length;
  const escalations = bays.filter(b => b.last_escalation_reason).length;

  document.getElementById('statTenants').textContent = re ? re.tenants_total : '—';
  document.getElementById('statOccupancy').textContent = re ? Math.round((re.occupancy_pct || 0) * 100) + '%' : '—';
  document.getElementById('statIncome').textContent = fmtMoney(totIn);
  document.getElementById('statCost').textContent = fmtMoney(totOut);
  const net = totIn - totOut;
  const netEl = document.getElementById('statNet');
  netEl.textContent = fmtMoney(net);
  netEl.className = 'stat-value ' + (net > 0 ? 'pos' : net < 0 ? 'neg' : 'gold');
  document.getElementById('statActive').textContent = activeBays + '/5';
  document.getElementById('statApps').textContent = re ? re.applications_total : '—';

  const health = document.getElementById('statHealth');
  if (escalations > 0) { health.textContent = 'ALERT'; health.className = 'stat-value neg'; }
  else if (bays.some(b => (b.failures_in_row||0) >= 2)) { health.textContent = 'WATCH'; health.className = 'stat-value'; health.style.color = 'var(--amber)'; }
  else { health.textContent = 'GREEN'; health.className = 'stat-value pos'; }
}

function renderClock() {
  const now = new Date();
  document.getElementById('clockDate').textContent = now.toISOString().slice(0, 10);
  document.getElementById('clockTime').textContent = now.toTimeString().slice(0, 8);
}

/* ============= ACTIVITY FEED ============= */
function renderFeed() {
  const list = document.getElementById('feedList');
  const entries = state.activity.slice(0, 60);
  if (!entries.length) {
    list.innerHTML = '<div class="loading">no activity yet</div>';
    return;
  }
  list.innerHTML = entries.map(e => `
    <div class="feed-row">
      <span class="feed-ts">${escapeHtml(e.ts || '').slice(11, 16) || '--:--'}</span>
      <span class="feed-agent">${escapeHtml(e.agent)}</span>
      <span class="feed-text">${escapeHtml(e.text)}</span>
    </div>
  `).join('');
  document.getElementById('feedCount').textContent = entries.length + ' events';
}

/* ============= SIDEBAR ============= */
function openSidebar(room) {
  state.currentSlot = room.slot;
  document.querySelectorAll('.tile.active').forEach(t => t.classList.remove('active'));
  const tile = document.querySelector(`.tile[data-slot="${room.slot}"]`);
  if (tile) tile.classList.add('active');

  const sb = document.getElementById('sidebar');
  const sc = document.getElementById('scrim');
  sb.classList.add('open');
  sc.classList.add('open');
  sb.setAttribute('aria-hidden', 'false');

  document.getElementById('sbId').textContent = 'BAY ' + room.id;
  document.getElementById('sbTitle').textContent = room.title;
  document.getElementById('sbRole').textContent = room.role || '';

  const chips = document.getElementById('sbChips');
  const body = document.getElementById('sbBody');
  chips.innerHTML = '';
  body.innerHTML = '';

  if (room.kind === 'vacant') {
    chips.innerHTML = '<span class="chip cyan">AVAILABLE</span>';
    body.innerHTML = `
      <div class="section">
        <h4>Plot open for a tenant</h4>
        <div class="blockquote">
          The yard is real estate. Every bay is a rental. Baseline rent: $20 / month. Premium bays: $40 / month.
          Tenant applications route to Brix for triage.
        </div>
      </div>
      <div class="section">
        <h4>How to apply</h4>
        <div class="kv">
          <dt>Baseline</dt><dd>$20 / month</dd>
          <dt>Grace</dt><dd>15 day onboarding</dd>
          <dt>Eviction</dt><dd>day 30 under rent</dd>
          <dt>Queue</dt><dd>Realtor inbox</dd>
        </div>
      </div>
    `;
    return;
  }

  if (room.kind === 'bay') {
    const b = state.byBay[room.bay];
    if (!b) {
      body.innerHTML = '<div class="loading">loading bay state…</div>';
      return;
    }
    const failures = b.failures_in_row || 0;
    chips.innerHTML = '';
    if (b.status) chips.insertAdjacentHTML('beforeend', `<span class="chip live">${escapeHtml(String(b.status).toUpperCase())}</span>`);
    if (b.mode)   chips.insertAdjacentHTML('beforeend', `<span class="chip cyan">${escapeHtml(String(b.mode).replace(/_/g,' ').toUpperCase())}</span>`);
    if (failures >= 2) chips.insertAdjacentHTML('beforeend', `<span class="chip warn">FAILS x${failures}</span>`);
    if (b.last_escalation_reason) chips.insertAdjacentHTML('beforeend', `<span class="chip crit">ESCALATED</span>`);

    const mtd = b.month_to_date || {};
    const pitch = b.business_pitch || {};
    const plan = b.self_funding_plan || {};
    const logs = Array.isArray(b.recent_log) ? b.recent_log : [];
    const hires = Array.isArray(b.hired_roster) ? b.hired_roster : [];

    body.innerHTML = `
      <div class="section">
        <h4>Mission</h4>
        <div class="blockquote">${escapeHtml(b.mission || BAY_DISPLAY[room.bay]?.mission || '—')}</div>
      </div>

      <div class="section">
        <h4>Live</h4>
        <dl class="kv">
          <dt>Last tick</dt><dd>${escapeHtml(b.last_tick_summary || '—')}</dd>
          <dt>When</dt><dd>${escapeHtml(fmtTimeAgo(b.last_tick_at))}</dd>
          <dt>Charter</dt><dd>v${escapeHtml(b.charter_version || '—')}</dd>
          <dt>Mode</dt><dd>${escapeHtml(b.mode || '—')}</dd>
        </dl>
      </div>

      <div class="section">
        <h4>Ledger (MTD)</h4>
        <dl class="kv">
          <dt>Income</dt><dd class="pos">${fmtMoney(mtd.income || 0)}</dd>
          <dt>Cost</dt><dd class="neg">${fmtMoney(mtd.cost || 0)}</dd>
          <dt>Net</dt><dd class="${(mtd.income||0) - (mtd.cost||0) >= 0 ? 'pos' : 'neg'}">${fmtMoney((mtd.income||0) - (mtd.cost||0))}</dd>
          ${mtd.rent_collected != null ? `<dt>Rent Collected</dt><dd class="gold">${fmtMoney(mtd.rent_collected)}</dd>` : ''}
          ${mtd.sales_count != null ? `<dt>Sales</dt><dd>${mtd.sales_count}</dd>` : ''}
        </dl>
      </div>

      ${pitch && (pitch.business_name || pitch.why_this) ? `
      <div class="section">
        <h4>Product / Pitch</h4>
        ${pitch.business_name ? `<div style="font-family:'Press Start 2P',monospace; font-size:11px; color:var(--bone); margin-bottom:6px;">${escapeHtml(pitch.business_name)}</div>` : ''}
        ${pitch.why_this ? `<div class="blockquote">${escapeHtml(pitch.why_this)}</div>` : ''}
        ${pitch.projected_mo_revenue ? `<div class="kv" style="margin-top:10px;"><dt>Target / mo</dt><dd class="gold">${fmtMoney(pitch.projected_mo_revenue)}</dd></div>` : ''}
      </div>` : ''}

      ${plan && (plan.pivot_at_d15_under || plan.kill_at_d30_under) ? `
      <div class="section">
        <h4>30-Day Contract</h4>
        <dl class="kv">
          ${plan.target_revenue_mo_1 != null ? `<dt>Target mo 1</dt><dd>${fmtMoney(plan.target_revenue_mo_1)}</dd>` : ''}
          ${plan.pivot_at_d15_under != null ? `<dt>Pivot d15</dt><dd class="neg">under ${fmtMoney(plan.pivot_at_d15_under)}</dd>` : ''}
          ${plan.kill_at_d30_under != null ? `<dt>Kill d30</dt><dd class="neg">under ${fmtMoney(plan.kill_at_d30_under)}</dd>` : ''}
        </dl>
      </div>` : ''}

      ${hires.length ? `
      <div class="section">
        <h4>Hired Roster (${hires.length})</h4>
        <ul class="log-list">
          ${hires.slice(0, 10).map(h => `
            <li>
              <span class="log-ts">${escapeHtml((h.installed_at || '').slice(0, 10))}</span>
              <strong>${escapeHtml(h.package || h.slug || 'tool')}</strong>
              ${h.purpose ? `<div style="color:var(--text-dim); font-size:10px; padding-left:90px;">${escapeHtml(h.purpose.slice(0, 200))}${h.purpose.length > 200 ? '…' : ''}</div>` : ''}
            </li>
          `).join('')}
        </ul>
      </div>` : ''}

      ${logs.length ? `
      <div class="section">
        <h4>Recent Log</h4>
        <ul class="log-list">
          ${logs.slice(-8).reverse().map(l => `<li>${escapeHtml(l)}</li>`).join('')}
        </ul>
      </div>` : ''}
    `;
    return;
  }

  // support room
  chips.innerHTML = '<span class="chip cyan">SYSTEM</span>';
  const s = supportMetric(room.id);
  body.innerHTML = `
    <div class="section">
      <h4>What it does</h4>
      <div class="blockquote">${escapeHtml(room.blurb || 'system component')}</div>
    </div>
    <div class="section">
      <h4>Live</h4>
      <dl class="kv">
        <dt>Status</dt><dd>${escapeHtml(s.badge)}</dd>
        <dt>Task</dt><dd>${escapeHtml(s.task)}</dd>
        <dt>${escapeHtml(s.metaL)}</dt><dd>${escapeHtml(s.metaR)}</dd>
      </dl>
    </div>
  `;
}

function closeSidebar() {
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('scrim').classList.remove('open');
  document.querySelectorAll('.tile.active').forEach(t => t.classList.remove('active'));
  state.currentSlot = null;
}

/* ============= FETCH ============= */
async function fetchJSON(url) {
  const r = await fetch(url);
  if (!r.ok) throw new Error(url + ' ' + r.status);
  return r.json();
}

async function refreshState() {
  try {
    const s = await fetchJSON('/api/state');
    state.byBay = {};
    for (const b of s.businesses || []) state.byBay[b.name] = b;
  } catch (e) { console.warn('state fail', e); }
  try { state.realestate = await fetchJSON('/api/realestate'); } catch (e) { console.warn('re fail', e); }
  try { state.portfolio  = await fetchJSON('/api/portfolio');  } catch (e) { console.warn('pf fail', e); }
  try {
    const a = await fetchJSON('/api/activity?limit=80');
    state.activity = a.entries || [];
  } catch (e) { console.warn('act fail', e); }

  for (const room of ROOMS) updateTile(room);
  renderHud();
  renderFeed();
  // refresh sidebar if open
  if (state.currentSlot) {
    const room = ROOMS.find(r => r.slot === state.currentSlot);
    if (room) openSidebar(room);
  }
}

/* ============= SSE ============= */
function wireStream() {
  try {
    const es = new EventSource('/api/stream');
    es.addEventListener('change', () => refreshState());
    es.addEventListener('realestate', () => refreshState());
    es.addEventListener('hire', () => refreshState());
    es.onerror = () => {
      // let browser retry
    };
  } catch (e) { console.warn('sse fail', e); }
}

/* ============= BOOT ============= */
document.getElementById('sidebarClose').addEventListener('click', closeSidebar);
document.getElementById('scrim').addEventListener('click', closeSidebar);
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeSidebar(); });

buildTiles();
refreshState();
wireStream();

setInterval(renderClock, 1000);
renderClock();
setInterval(refreshState, 20_000); // safety poll in case SSE drops
</script>
