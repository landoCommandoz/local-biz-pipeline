<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brewington Yard - Live Command</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --warm-brown: #6e5630;
            --dusty-tan: #a68550;
            --amber-glow: #ffb347;
            --deep-indigo: #1a1f3a;
            --signal-cyan: #00e5ff;
            --muted-green: #7a8f5a;
            --muted-red: #a65a5a;
            --warm-cream: #f5f1e8;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'JetBrains Mono', monospace;
            background: linear-gradient(to bottom, var(--amber-glow) 0%, var(--dusty-tan) 50%, var(--deep-indigo) 100%);
            height: 100vh;
            overflow: hidden;
            color: var(--warm-cream);
        }

        .top-ribbon {
            height: 40px;
            background: rgba(26, 31, 58, 0.9);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
            font-size: 12px;
            font-weight: 500;
            border-bottom: 1px solid var(--dusty-tan);
        }

        .bottom-ribbon {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 40px;
            background: rgba(26, 31, 58, 0.9);
            border-top: 1px solid var(--dusty-tan);
            overflow: hidden;
        }

        .activity-feed {
            display: flex;
            align-items: center;
            height: 100%;
            white-space: nowrap;
            animation: scroll-left 60s linear infinite;
            font-size: 11px;
            padding: 0 20px;
        }

        .activity-item {
            margin-right: 40px;
            opacity: 0.8;
        }

        @keyframes scroll-left {
            from { transform: translateX(100%); }
            to { transform: translateX(-100%); }
        }

        .yard-container {
            position: relative;
            width: 100%;
            height: calc(100vh - 80px);
            display: flex;
            justify-content: center;
            align-items: center;
            perspective: 1000px;
        }

        .yard-scene {
            width: 800px;
            height: 600px;
            position: relative;
            transform-style: preserve-3d;
            transform: rotateX(30deg) rotateY(-15deg) scale(0.9);
        }

        .workshop {
            position: absolute;
            width: 120px;
            height: 100px;
        }

        .workshop-jax { top: 50px; left: 100px; }
        .workshop-hank { top: 20px; left: 300px; }
        .workshop-doss { top: 20px; left: 500px; }
        .workshop-brix { top: 150px; left: 580px; }
        .workshop-vega { top: 300px; left: 350px; }

        .building {
            width: 100%;
            height: 70px;
            background: var(--warm-brown);
            border: 2px solid var(--dusty-tan);
            position: relative;
            border-radius: 4px;
        }

        .roof {
            width: 110%;
            height: 20px;
            background: #666;
            position: absolute;
            top: -15px;
            left: -5%;
            border-radius: 8px 8px 0 0;
            border: 1px solid #555;
        }

        .nameplate {
            position: absolute;
            bottom: -25px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--deep-indigo);
            color: var(--warm-cream);
            padding: 2px 6px;
            border-radius: 2px;
            font-size: 9px;
            font-weight: 500;
            white-space: nowrap;
        }

        .rent-gauge {
            position: absolute;
            right: -15px;
            top: 10px;
            width: 8px;
            height: 40px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 4px;
        }

        .rent-fill {
            width: 100%;
            background: var(--muted-green);
            border-radius: 4px;
            transition: all 0.5s ease;
            position: absolute;
            bottom: 0;
        }

        .rent-fill.warning { background: var(--amber-glow); }
        .rent-fill.danger { 
            background: var(--muted-red);
            animation: pulse-red 2s infinite;
        }

        @keyframes pulse-red {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .character {
            position: absolute;
            bottom: 5px;
            left: 50%;
            transform: translateX(-50%);
            width: 24px;
            height: 36px;
        }

        .character svg {
            width: 100%;
            height: 100%;
            animation: subtle-breath 4s ease-in-out infinite;
        }

        @keyframes subtle-breath {
            0%, 100% { transform: scale(1) translateY(0); }
            50% { transform: scale(1.02) translateY(-1px); }
        }

        .thought-bubble {
            position: absolute;
            top: -40px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--signal-cyan);
            color: var(--deep-indigo);
            padding: 4px 8px;
            border-radius: 12px;
            font-size: 8px;
            max-width: 100px;
            text-align: center;
            opacity: 0;
            animation: fade-in-out 8s ease-in-out;
            z-index: 10;
        }

        .thought-bubble::after {
            content: '';
            position: absolute;
            top: 100%;
            left: 50%;
            transform: translateX(-50%);
            border: 4px solid transparent;
            border-top-color: var(--signal-cyan);
        }

        @keyframes fade-in-out {
            0%, 100% { opacity: 0; transform: translateX(-50%) scale(0.8); }
            10%, 90% { opacity: 1; transform: translateX(-50%) scale(1); }
        }

        .lamp {
            position: absolute;
            top: -8px;
            right: 15px;
            width: 6px;
            height: 6px;
            background: var(--amber-glow);
            border-radius: 50%;
            animation: lamp-flicker 3s ease-in-out infinite;
        }

        @keyframes lamp-flicker {
            0%, 100% { opacity: 1; box-shadow: 0 0 8px var(--amber-glow); }
            50% { opacity: 0.7; box-shadow: 0 0 4px var(--amber-glow); }
        }

        .central-path {
            position: absolute;
            top: 200px;
            left: 340px;
            width: 120px;
            height: 200px;
            background: rgba(166, 133, 80, 0.3);
            border-radius: 8px;
        }

        .gate {
            position: absolute;
            bottom: -20px;
            left: 50%;
            transform: translateX(-50%);
            width: 40px;
            height: 20px;
            background: var(--warm-brown);
            border: 2px solid var(--dusty-tan);
            border-radius: 4px;
        }

        .failure-beacon {
            position: absolute;
            top: -30px;
            left: 50%;
            transform: translateX(-50%);
            width: 12px;
            height: 12px;
            background: var(--muted-red);
            border-radius: 50%;
            animation: beacon-pulse 1s ease-in-out infinite;
            opacity: 0;
        }

        .failure-beacon.active {
            opacity: 1;
        }

        @keyframes beacon-pulse {
            0%, 100% { transform: translateX(-50%) scale(1); }
            50% { transform: translateX(-50%) scale(1.2); box-shadow: 0 0 8px var(--muted-red); }
        }

        .coin {
            position: absolute;
            width: 8px;
            height: 8px;
            background: var(--amber-glow);
            border-radius: 50%;
            animation: coin-fall 2s ease-in forwards;
            z-index: 5;
        }

        @keyframes coin-fall {
            0% { opacity: 1; transform: translateY(-50px); }
            100% { opacity: 0; transform: translateY(0px); }
        }

        .arrival-figure {
            position: absolute;
            bottom: 380px;
            left: 350px;
            width: 16px;
            height: 24px;
            animation: walk-to-hank 5s linear forwards;
            z-index: 5;
        }

        @keyframes walk-to-hank {
            0% { bottom: 380px; left: 350px; }
            100% { bottom: 100px; left: 320px; }
        }

        @media (max-width: 768px) {
            .yard-scene {
                transform: rotateX(30deg) rotateY(-15deg) scale(0.6);
            }
            
            .top-ribbon, .bottom-ribbon {
                font-size: 10px;
                padding: 0 10px;
            }
        }

        @media (max-height: 600px) {
            .yard-scene {
                transform: rotateX(30deg) rotateY(-15deg) scale(0.7);
            }
        }
    </style>
</head>
<body>
    <div class="top-ribbon">
        <span>BREWINGTON YARD</span>
        <span id="clock">--:--:--</span>
        <span id="mtd-net">MTD: $0</span>
    </div>

    <div class="yard-container">
        <div class="yard-scene">
            <!-- Central Path and Gate -->
            <div class="central-path">
                <div class="gate"></div>
            </div>

            <!-- Jax Workshop -->
            <div class="workshop workshop-jax">
                <div class="building">
                    <div class="roof"></div>
                    <div class="lamp"></div>
                    <div class="character">
                        <svg viewBox="0 0 24 36">
                            <rect x="8" y="8" width="8" height="12" fill="#4a4a4a" rx="1"/>
                            <rect x="6" y="20" width="12" height="8" fill="#5a4a3a" rx="1"/>
                            <rect x="7" y="28" width="4" height="6" fill="#3a3a3a"/>
                            <rect x="13" y="28" width="4" height="6" fill="#3a3a3a"/>
                            <circle cx="12" cy="6" r="4" fill="#d4a574"/>
                            <rect x="10" y="2" width="4" height="2" fill="#6a4a2a" rx="2"/>
                            <rect x="4" y="18" width="3" height="8" fill="#8a6a4a" rx="1"/>
                        </svg>
                    </div>
                </div>
                <div class="nameplate">JAX — BUILDER</div>
                <div class="rent-gauge">
                    <div class="rent-fill" style="height: 70%"></div>
                </div>
                <div class="failure-beacon" id="beacon-jax"></div>
                <div class="thought-bubble" id="thought-jax"></div>
            </div>

            <!-- Hank Workshop -->
            <div class="workshop workshop-hank">
                <div class="building">
                    <div class="roof"></div>
                    <div class="lamp"></div>
                    <div class="character">
                        <svg viewBox="0 0 24 36">
                            <rect x="8" y="8" width="8" height="12" fill="#6a5a4a" rx="1"/>
                            <rect x="6" y="20" width="12" height="8" fill="#4a5a6a" rx="1"/>
                            <rect x="7" y="28" width="4" height="6" fill="#3a3a3a"/>
                            <rect x="13" y="28" width="4" height="6" fill="#3a3a3a"/>
                            <circle cx="12" cy="6" r="4" fill="#d4a574"/>
                            <rect x="8" y="1" width="8" height="3" fill="#ffa500" rx="1"/>
                            <rect x="2" y="12" width="2" height="8" fill="#8a6a4a" rx="1"/>
                        </svg>
                    </div>
                </div>
                <div class="nameplate">HANK — FOREMAN</div>
                <div class="rent-gauge">
                    <div class="rent-fill" style="height: 85%"></div>
                </div>
                <div class="failure-beacon" id="beacon-hank"></div>
                <div class="thought-bubble" id="thought-hank"></div>
            </div>

            <!-- Doss Workshop -->
            <div class="workshop workshop-doss">
                <div class="building">
                    <div class="roof"></div>
                    <div class="lamp"></div>
                    <div class="character">
                        <svg viewBox="0 0 24 36">
                            <rect x="8" y="8" width="8" height="12" fill="#5a4a5a" rx="1"/>
                            <rect x="6" y="20" width="12" height="8" fill="#4a6a4a" rx="1"/>
                            <rect x="7" y="28" width="4" height="6" fill="#3a3a3a"/>
                            <rect x="13" y="28" width="4" height="6" fill="#3a3a3a"/>
                            <circle cx="12" cy="6" r="4" fill="#d4a574"/>
                            <rect x="9" y="3" width="6" height="1" fill="#2a2a2a" rx="0.5"/>
                            <rect x="5" y="15" width="2" height="2" fill="#8a6a4a" rx="1"/>
                            <rect x="17" y="15" width="2" height="2" fill="#8a6a4a" rx="1"/>
                        </svg>
                    </div>
                </div>
                <div class="nameplate">DOSS — PAYMASTER</div>
                <div class="rent-gauge">
                    <div class="rent-fill" style="height: 60%"></div>
                </div>
                <div class="failure-beacon" id="beacon-doss"></div>
                <div class="thought-bubble" id="thought-doss"></div>
            </div>

            <!-- Brix Workshop -->
            <div class="workshop workshop-brix">
                <div class="building">
                    <div class="roof"></div>
                    <div class="lamp"></div>
                    <div class="character">
                        <svg viewBox="0 0 24 36">
                            <rect x="8" y="8" width="8" height="12" fill="#3a4a5a" rx="1"/>
                            <rect x="6" y="20" width="12" height="8" fill="#5a4a4a" rx="1"/>
                            <rect x="7" y="28" width="4" height="6" fill="#3a3a3a"/>
                            <rect x="13" y="28" width="4" height="6" fill="#3a3a3a"/>
                            <circle cx="12" cy="6" r="4" fill="#d4a574"/>
                            <rect x="6" y="8" width="12" height="2" fill="#2a3a4a" rx="1"/>
                            <rect x="19" y="12" width="2" height="6" fill="#8a6a4a" rx="1"/>
                        </svg>
                    </div>
                </div>
                <div class="nameplate">BRIX — REALTOR</div>
                <div class="rent-gauge">
                    <div class="rent-fill" style="height: 90%"></div>
                </div>
                <div class="failure-beacon" id="beacon-brix"></div>
                <div class="thought-bubble" id="thought-brix"></div>
            </div>

            <!-- Vega Workshop -->
            <div class="workshop workshop-vega">
                <div class="building">
                    <div class="roof"></div>
                    <div class="lamp"></div>
                    <div class="character">
                        <svg viewBox="0 0 24 36">
                            <rect x="8" y="8" width="8" height="16" fill="#2a3a2a" rx="1"/>
                            <rect x="7" y="24" width="4" height="8" fill="#3a3a3a"/>
                            <rect x="13" y="24" width="4" height="8" fill="#3a3a3a"/>
                            <circle cx="12" cy="6" r="4" fill="#d4a574"/>
                            <rect x="4" y="10" width="4" height="1" fill="#4a4a4a" rx="0.5"/>
                            <rect x="16" y="10" width="4" height="1" fill="#4a4a4a" rx="0.5"/>
                        </svg>
                    </div>
                </div>
                <div class="nameplate">VEGA — SCOUT</div>
                <div class="rent-gauge">
                    <div class="rent-fill warning" style="height: 40%"></div>
                </div>
                <div class="failure-beacon" id="beacon-vega"></div>
                <div class="thought-bubble" id="thought-vega"></div>
            </div>
        </div>
    </div>

    <div class="bottom-ribbon">
        <div class="activity-feed" id="activity-feed">
            <div class="activity-item">Connecting to yard systems...</div>
        </div>
    </div>

    <script>
        let lastData = null;
        let lastMtd = 0;
        const activityItems = [];

        function updateClock() {
            const now = new Date();
            document.getElementById('clock').textContent = now.toLocaleTimeString();
        }

        function showThoughtBubble(agentName, message) {
            const bubble = document.getElementById(`thought-${agentName.toLowerCase()}`);
            if (bubble) {
                bubble.textContent = message.substring(0, 30) + (message.length > 30 ? '...' : '');
                bubble.style.animation = 'none';
                bubble.offsetHeight;
                bubble.style.animation = 'fade-in-out 8s ease-in-out';
            }
        }

        function dropCoin(agentName) {
            const workshop = document.querySelector(`.workshop-${agentName.toLowerCase()}`);
            if (workshop) {
                const coin = document.createElement('div');
                coin.className = 'coin';
                coin.style.left = '50%';
                coin.style.top = '-50px';
                workshop.appendChild(coin);
                setTimeout(() => workshop.removeChild(coin), 2000);
            }
        }

        function updateFailureBeacon(agentName, hasFailures) {
            const beacon = document.getElementById(`beacon-${agentName.toLowerCase()}`);
            if (beacon) {
                if (hasFailures) {
                    beacon.classList.add('active');
                } else {
                    beacon.classList.remove('active');
                }
            }
        }

        function addActivityItem(text) {
            activityItems.push(text);
            if (activityItems.length > 5) {
                activityItems.shift();
            }
            document.getElementById('activity-feed').innerHTML = 
                activityItems.map(item => `<div class="activity-item">${item}</div>`).join('');
        }

        function checkForTicks(data) {
            if (!lastData || !data.businesses) return;

            data.businesses.forEach(business => {
                const lastBusiness = lastData.businesses?.find(b => b.name === business.name);
                if (lastBusiness && business.last_tick_at !== lastBusiness.last_tick_at) {
                    showThoughtBubble(business.display_name, business.last_tick_summary || 'Working...');
                    addActivityItem(`${business.display_name.toUpperCase()} ticked: ${business.last_tick_summary?.substring(0, 20) || 'task complete'}`);
                }

                if (business.month_to_date.income > (lastBusiness?.month_to_date.income || 0)) {
                    dropCoin(business.display_name);
                    addActivityItem(`${business.display_name.toUpperCase()} earned $${business.month_to_date.income - (lastBusiness?.month_to_date.income || 0)}`);
                }

                updateFailureBeacon(business.display_name, business.failures_in_row > 0);
            });
        }

        async function fetchData() {
            try {
                const response = await fetch('/api/state');
                const data = await response.json();
                
                document.getElementById('mtd-net').textContent = `MTD: $${data.overall.mtd_net}`;
                
                checkForTicks(data);
                lastData = data;
            } catch (error) {
                console.warn('Failed to fetch yard data:', error);
                addActivityItem('Connection lost, reconnecting...');
            }
        }

        function simulateArrival() {
            if (Math.random() < 0.1) {
                const figure = document.createElement('div');
                figure.className = 'arrival-figure';
                figure.innerHTML = '<svg viewBox="0 0 16 24"><rect x="6" y="6" width="4" height="8" fill="#5a5a5a"/><rect x="5" y="14" width="6" height="6" fill="#4a4a4a"/><circle cx="8" cy="4" r="2" fill="#d4a574"/></svg>';
                document.querySelector('.yard-scene').appendChild(figure);
                setTimeout(() => {
                    if (figure.parentNode) figure.parentNode.removeChild(figure);
                }, 5000);
                addActivityItem('HANK: New candidate approaching gate');
            }
        }

        // Initialize
        updateClock();
        setInterval(updateClock, 1000);
        setInterval(fetchData, 15000);
        setInterval(simulateArrival, 45000);
        fetchData();

        // Initial activity
        setTimeout(() => addActivityItem('YARD systems online'), 1000);
        setTimeout(() => addActivityItem('JAX: Ready for builds'), 3000);
        setTimeout(() => addActivityItem('HANK: Monitoring gate activity'), 5000);
    </script>
</body>
</html>
