<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BREWINGTON YARD // GOD VIEW</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700&family=DM+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --signal-cyan: #0ff;
            --signal-green: #0f0;
            --signal-amber: #fa0;
            --signal-red: #f40;
            --warm-white: #faf9f7;
            --cool-grey: #888;
            --dark-grey: #333;
            --black: #000;
            --dim-alpha: 0.6;
            
            --font-display: 'Syne', sans-serif;
            --font-body: 'DM Sans', sans-serif;
            --font-mono: 'JetBrains Mono', monospace;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-body);
            background: var(--black);
            color: var(--warm-white);
            min-height: 100vh;
            overflow-x: hidden;
        }

        .top-bar {
            height: 56px;
            border-bottom: 1px solid var(--dark-grey);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 24px;
            position: sticky;
            top: 0;
            background: var(--black);
            z-index: 100;
        }

        .brand {
            font-family: var(--font-display);
            font-weight: 700;
            font-size: 18px;
            color: var(--signal-cyan);
        }

        .stats {
            display: flex;
            gap: 32px;
            font-family: var(--font-mono);
            font-size: 12px;
            color: var(--cool-grey);
        }

        .stats .stat-item {
            display: flex;
            flex-direction: column;
            text-align: right;
            gap: 2px;
        }

        .stats .stat-value {
            color: var(--warm-white);
            font-weight: 500;
        }

        .clock-section {
            display: flex;
            align-items: center;
            gap: 12px;
            font-family: var(--font-mono);
            font-size: 12px;
        }

        .rent-day-banner {
            height: 28px;
            background: var(--signal-red);
            color: var(--black);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: var(--font-mono);
            font-weight: 500;
            font-size: 12px;
            animation: rentBeat 2s ease-in-out infinite;
        }

        .rent-day-banner.hidden {
            display: none;
        }

        @keyframes rentBeat {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.8; }
        }

        .wins-ticker {
            height: 32px;
            background: var(--dark-grey);
            border-bottom: 1px solid var(--cool-grey);
            overflow: hidden;
            position: relative;
        }

        .wins-scroll {
            display: flex;
            gap: 32px;
            animation: scroll 60s linear infinite;
            white-space: nowrap;
            padding: 8px 0;
            font-family: var(--font-mono);
            font-size: 11px;
            color: var(--signal-green);
        }

        @keyframes scroll {
            0% { transform: translateX(100%); }
            100% { transform: translateX(-100%); }
        }

        .main-grid {
            display: grid;
            grid-template-columns: 1fr 320px;
            height: calc(100vh - 120px);
        }

        .village-grid {
            padding: 24px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 16px;
            align-content: start;
            overflow-y: auto;
        }

        .bay-card {
            width: 240px;
            height: 180px;
            border: 1px solid var(--dark-grey);
            background: var(--black);
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            transition: all 0.2s ease;
            cursor: pointer;
        }

        .bay-card:hover {
            border-color: var(--signal-cyan);
        }

        .bay-card.dead {
            opacity: var(--dim-alpha);
            filter: grayscale(1);
        }

        .bay-card.pulsing {
            animation: healthPulse 3s ease-in-out infinite;
        }

        .bay-card.stale {
            animation: stalePulse 6s ease-in-out infinite;
        }

        @keyframes healthPulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.9; }
        }

        @keyframes stalePulse {
            0%, 100% { opacity: 0.6; }
            50% { opacity: 0.4; }
        }

        .bay-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .bay-name {
            font-family: var(--font-display);
            font-weight: 600;
            font-size: 14px;
            color: var(--warm-white);
        }

        .bay-role {
            font-size: 10px;
            color: var(--cool-grey);
            margin-top: 2px;
        }

        .status-badge {
            background: var(--dark-grey);
            color: var(--warm-white);
            padding: 2px 6px;
            border-radius: 2px;
            font-size: 9px;
            font-family: var(--font-mono);
            text-transform: uppercase;
        }

        .kill-clock {
            font-family: var(--font-mono);
            font-weight: 500;
            font-size: 18px;
            text-align: center;
            padding: 8px 0;
        }

        .kill-clock.green { color: var(--signal-green); }
        .kill-clock.amber { color: var(--signal-amber); }
        .kill-clock.red { color: var(--signal-red); }
        .kill-clock.black { color: var(--cool-grey); }

        .revenue-gauge {
            height: 4px;
            background: var(--dark-grey);
            border-radius: 2px;
            overflow: hidden;
            margin: 4px 0;
        }

        .revenue-fill {
            height: 100%;
            background: var(--signal-cyan);
            transition: width 0.3s ease;
        }

        .revenue-fill.over-target {
            background: var(--signal-amber);
        }

        .bay-details {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: auto;
        }

        .failure-badge {
            background: var(--signal-red);
            color: var(--black);
            padding: 2px 4px;
            border-radius: 2px;
            font-size: 9px;
            font-family: var(--font-mono);
            font-weight: 500;
        }

        .last-tick {
            font-size: 10px;
            color: var(--cool-grey);
            flex: 1;
            margin: 4px 0;
            overflow: hidden;
            white-space: nowrap;
            text-overflow: ellipsis;
        }

        .hire-chips {
            display: flex;
            gap: 2px;
            margin-top: 4px;
        }

        .hire-chip {
            width: 16px;
            height: 16px;
            background: var(--dark-grey);
            border-radius: 2px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 8px;
            font-family: var(--font-mono);
            color: var(--warm-white);
        }

        .books-ledger {
            background: var(--dark-grey);
            padding: 24px;
            border-left: 1px solid var(--cool-grey);
            overflow-y: auto;
        }

        .ledger-title {
            font-family: var(--font-display);
            font-weight: 600;
            color: var(--warm-white);
            margin-bottom: 16px;
            font-size: 14px;
        }

        .mtd-summary {
            margin-bottom: 24px;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--cool-grey);
        }

        .mtd-line {
            display: flex;
            justify-content: space-between;
            margin-bottom: 4px;
            font-family: var(--font-mono);
            font-size: 11px;
        }

        .mtd-line .label {
            color: var(--cool-grey);
        }

        .mtd-line .value {
            color: var(--warm-white);
        }

        .mtd-line.net .value {
            color: var(--signal-green);
        }

        .ledger-entries {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .ledger-entry {
            padding: 8px;
            background: var(--black);
            border-radius: 2px;
            font-family: var(--font-mono);
            font-size: 10px;
            cursor: pointer;
            transition: background 0.2s ease;
        }

        .ledger-entry:hover {
            background: var(--dark-grey);
        }

        .entry-line {
            display: flex;
            justify-content: space-between;
            margin-bottom: 2px;
        }

        .entry-source {
            color: var(--cool-grey);
        }

        .entry-amount {
            color: var(--signal-green);
        }

        .entry-amount.cost {
            color: var(--signal-red);
        }

        .entry-desc {
            color: var(--warm-white);
            font-size: 9px;
            opacity: 0.8;
        }

        .pulse-highlight {
            animation: pulseHighlight 1s ease-out;
        }

        @keyframes pulseHighlight {
            0% { background: var(--signal-cyan); }
            100% { background: transparent; }
        }

        @media (max-width: 768px) {
            .main-grid {
                grid-template-columns: 1fr;
                grid-template-rows: 1fr auto;
            }
            
            .village-grid {
                grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            }
            
            .bay-card {
                width: 100%;
                min-width: 200px;
            }
            
            .books-ledger {
                height: 300px;
            }
        }
    </style>
</head>
<body>
    <div class="top-bar">
        <div class="brand">BREWINGTON YARD // GOD VIEW</div>
        <div class="stats">
            <div class="stat-item">
                <div class="stat-value" id="total-income">$0</div>
                <div>MTD INCOME</div>
            </div>
            <div class="stat-item">
                <div class="stat-value" id="total-cost">$0</div>
                <div>MTD COST</div>
            </div>
            <div class="stat-item">
                <div class="stat-value" id="net-total">$0</div>
                <div>NET</div>
            </div>
            <div class="stat-item">
                <div class="stat-value" id="tenant-count">0</div>
                <div>TENANTS</div>
            </div>
        </div>
        <div class="clock-section">
            <div id="current-time"></div>
            <div id="dusk-indicator" style="display: none;">DUSK</div>
            <div id="scheduler-lamp" style="display: none;">●</div>
        </div>
    </div>

    <div class="rent-day-banner hidden" id="rent-day-banner">
        RENT WEEK — <span id="tenants-on-clock">0</span> tenants on the clock
    </div>

    <div class="wins-ticker">
        <div class="wins-scroll" id="wins-scroll">
            <span>System initializing...</span>
        </div>
    </div>

    <div class="main-grid">
        <div class="village-grid" id="village-grid">
            <!-- Bay cards will be rendered here -->
        </div>

        <div class="books-ledger">
            <div class="ledger-title">BOOKS</div>
            
            <div class="mtd-summary">
                <div class="mtd-line">
                    <span class="label">Income</span>
                    <span class="value" id="ledger-income">$0</span>
                </div>
                <div class="mtd-line">
                    <span class="label">Cost</span>
                    <span class="value" id="ledger-cost">$0</span>
                </div>
                <div class="mtd-line net">
                    <span class="label">Net</span>
                    <span class="value" id="ledger-net">$0</span>
                </div>
            </div>

            <div class="ledger-entries" id="ledger-entries">
                <!-- Ledger entries will be rendered here -->
            </div>
        </div>
    </div>

    <script>
        class YardCommand {
            constructor() {
                this.state = {};
                this.realestate = {};
                this.activity = [];
                this.wins = [];
                this.init();
            }

            async init() {
                this.startClock();
                await this.loadData();
                this.render();
                this.startPolling();
            }

            startClock() {
                this.updateClock();
                setInterval(() => this.updateClock(), 1000);
            }

            updateClock() {
                const now = new Date();
                const timeStr = now.toLocaleTimeString('en-US', { 
                    hour12: false, 
                    hour: '2-digit', 
                    minute: '2-digit' 
                });
                document.getElementById('current-time').textContent = timeStr;

                const hour = now.getHours();
                const duskIndicator = document.getElementById('dusk-indicator');
                const schedulerLamp = document.getElementById('scheduler-lamp');

                if (hour >= 18 || hour < 6) {
                    duskIndicator.style.display = 'block';
                } else {
                    duskIndicator.style.display = 'none';
                }

                if (hour >= 9 && hour < 17) {
                    schedulerLamp.style.display = 'block';
                } else {
                    schedulerLamp.style.display = 'none';
                }
            }

            async loadData() {
                try {
                    const [stateRes, realestateRes, activityRes] = await Promise.all([
                        fetch('/api/state').catch(() => ({ ok: false })),
                        fetch('/api/realestate').catch(() => ({ ok: false })),
                        fetch('/api/activity').catch(() => ({ ok: false }))
                    ]);

                    if (stateRes.ok) {
                        this.state = await stateRes.json();
                    }
                    if (realestateRes.ok) {
                        this.realestate = await realestateRes.json();
                    }
                    if (activityRes.ok) {
                        this.activity = await activityRes.json();
                    }
                } catch (error) {
                    console.warn('Data fetch error:', error);
                    this.loadMockData();
                }
            }

            loadMockData() {
                this.state = {
                    bays: [
                        {
                            display_name: 'ECHO_AGENT',
                            role_title: 'Customer Service',
                            current_mode: 'ACTIVE',
                            status: 'healthy',
                            last_tick_at: new Date(Date.now() - 1000 * 60 * 30).toISOString(),
                            last_tick_summary: 'Processed 12 customer inquiries, avg response 2.3min',
                            failures_in_row: 0,
                            month_to_date: { income: 2400, cost: 800 },
                            self_funding_plan: { target_revenue_mo_1: 3000, kill_at_d30_under: 1500 },
                            business_pitch: { d30_checkpoint: new Date(Date.now() + 1000 * 60 * 60 * 24 * 18).toISOString() },
                            hired_roster: ['jax', 'lando', 'hank']
                        },
                        {
                            display_name: 'SALES_BOT',
                            role_title: 'Lead Generation',
                            current_mode: 'IDLE',
                            status: 'warning',
                            last_tick_at: new Date(Date.now() - 1000 * 60 * 60 * 6).toISOString(),
                            last_tick_summary: 'Generated 3 qualified leads, conversion rate 15%',
                            failures_in_row: 2,
                            month_to_date: { income: 1200, cost: 600 },
                            self_funding_plan: { target_revenue_mo_1: 2000, kill_at_d30_under: 1000 },
                            business_pitch: { d30_checkpoint: new Date(Date.now() + 1000 * 60 * 60 * 24 * 5).toISOString() },
                            hired_roster: ['jax', 'lando']
                        }
                    ]
                };
                this.activity = [
                    { timestamp: new Date().toISOString(), source: 'ECHO_AGENT', amount: 150, type: 'income', description: 'Customer service completion bonus' },
                    { timestamp: new Date(Date.now() - 1000 * 60 * 60).toISOString(), source: 'SALES_BOT', amount: -50, type: 'cost', description: 'API usage charges' }
                ];
            }

            render() {
                this.renderStats();
                this.renderBays();
                this.renderLedger();
                this.renderWinsTicker();
                this.renderRentDayBanner();
            }

            renderStats() {
                const totalIncome = this.state.businesses?.reduce((sum, bay) => sum + (bay.month_to_date?.income || 0), 0) || 0;
                const totalCost = this.state.businesses?.reduce((sum, bay) => sum + (bay.month_to_date?.cost || 0), 0) || 0;
                const net = totalIncome - totalCost;
                const tenantCount = this.state.businesses?.length || 0;

                document.getElementById('total-income').textContent = `$${totalIncome}`;
                document.getElementById('total-cost').textContent = `$${totalCost}`;
                document.getElementById('net-total').textContent = `$${net}`;
                document.getElementById('tenant-count').textContent = tenantCount;

                document.getElementById('ledger-income').textContent = `$${totalIncome}`;
                document.getElementById('ledger-cost').textContent = `$${totalCost}`;
                document.getElementById('ledger-net').textContent = `$${net}`;
            }

            renderBays() {
                const grid = document.getElementById('village-grid');
                grid.innerHTML = '';

                if (!this.state.businesses || this.state.businesses.length === 0) {
                    grid.innerHTML = '<div style="grid-column: 1/-1; text-align: center; color: var(--cool-grey); margin-top: 40px;">No bays found</div>';
                    return;
                }

                this.state.businesses.forEach(bay => {
                    const card = this.createBayCard(bay);
                    grid.appendChild(card);
                });
            }

            createBayCard(bay) {
                const card = document.createElement('div');
                card.className = 'bay-card';
                card.dataset.bayName = bay.display_name;

                const daysLeft = this.calculateDaysLeft(bay.business_pitch?.d30_checkpoint);
                const killColor = this.getKillClockColor(daysLeft, bay.month_to_date, bay.self_funding_plan);
                const healthState = this.getHealthState(bay.last_tick_at);
                const revenuePercent = this.calculateRevenuePercent(bay.month_to_date, bay.self_funding_plan);

                card.className += ` ${healthState}`;
                if (killColor === 'black') {
                    card.className += ' dead';
                }

                card.innerHTML = `
                    <div class="bay-header">
                        <div>
                            <div class="bay-name">${bay.display_name || 'UNKNOWN'}</div>
                            <div class="bay-role">${bay.role_title || 'No role assigned'}</div>
                        </div>
                        <div class="status-badge">${bay.current_mode || 'UNKNOWN'}</div>
                    </div>
                    
                    <div class="kill-clock ${killColor}">
                        ${this.formatKillClock(daysLeft)}
                    </div>
                    
                    <div class="revenue-gauge">
                        <div class="revenue-fill ${revenuePercent > 100 ? 'over-target' : ''}" 
                             style="width: ${Math.min(revenuePercent, 100)}%"></div>
                    </div>
                    
                    <div class="last-tick">${bay.last_tick_summary || 'No recent activity'}</div>
                    
                    <div class="bay-details">
                        ${bay.failures_in_row > 0 ? `<div class="failure-badge">${bay.failures_in_row}</div>` : '<div></div>'}
                        <div class="hire-chips">
                            ${(bay.hired_roster || []).slice(0, 7).map(hire => 
                                `<div class="hire-chip" title="${hire}">${hire.slice(0, 2).toUpperCase()}</div>`
                            ).join('')}
                        </div>
                    </div>
                `;

                card.addEventListener('click', () => this.pulseBay(bay.display_name));
                return card;
            }

            calculateDaysLeft(checkpoint) {
                if (!checkpoint) return null;
                const now = new Date();
                const target = new Date(checkpoint);
                const diff = target - now;
                return Math.ceil(diff / (1000 * 60 * 60 * 24));
            }

            getKillClockColor(daysLeft, mtd, plan) {
                if (daysLeft === null) return 'black';
                if (daysLeft < 0) return 'black';
                
                const income = mtd?.income || 0;
                const target = plan?.target_revenue_mo_1 || 1000;
                const onPace = income >= (target * 0.5);

                if (daysLeft > 15 && onPace) return 'green';
                if (daysLeft >= 7 && (onPace || income > 0)) return 'amber';
                if (daysLeft < 7) return 'red';
                return 'amber';
            }

            formatKillClock(daysLeft) {
                if (daysLeft === null) return 'NO DATA';
                if (daysLeft < 0) return 'OVERDUE';
                if (daysLeft === 0) return 'TODAY';
                return `${daysLeft}d`;
            }

            getHealthState(lastTick) {
                if (!lastTick) return 'stale';
                const now = new Date();
                const tick = new Date(lastTick);
                const hoursDiff = (now - tick) / (1000 * 60 * 60);

                if (hoursDiff < 6) return 'pulsing';
                if (hoursDiff < 24) return '';
                if (hoursDiff < 72) return 'stale';
                return 'dead';
            }

            calculateRevenuePercent(mtd, plan) {
                const income = mtd?.income || 0;
                const target = plan?.target_revenue_mo_1 || 1000;
                return (income / target) * 100;
            }

            renderLedger() {
                const entries = document.getElementById('ledger-entries');
                entries.innerHTML = '';

                const sortedActivity = [...(this.activity || [])].sort((a, b) => 
                    new Date(b.timestamp) - new Date(a.timestamp)
                ).slice(0, 12);

                sortedActivity.forEach(entry => {
                    const div = document.createElement('div');
                    div.className = 'ledger-entry';
                    div.dataset.source = entry.source;

                    const time = new Date(entry.timestamp).toLocaleTimeString('en-US', { 
                        hour12: false, 
                        hour: '2-digit', 
                        minute: '2-digit' 
                    });

                    const amountClass = entry.amount > 0 ? 'entry-amount' : 'entry-amount cost';
                    const amountText = entry.amount > 0 ? `+$${entry.amount}` : `-$${Math.abs(entry.amount)}`;

                    div.innerHTML = `
                        <div class="entry-line">
                            <span class="entry-source">${entry.source} ${time}</span>
                            <span class="${amountClass}">${amountText}</span>
                        </div>
                        <div class="entry-desc">${entry.description}</div>
                    `;

                    div.addEventListener('click', () => this.pulseBay(entry.source));
                    entries.appendChild(div);
                });
            }

            renderWinsTicker() {
                const scroll = document.getElementById('wins-scroll');
                if (this.wins.length === 0) {
                    scroll.innerHTML = '<span>Monitoring yard activity...</span>';
                } else {
                    scroll.innerHTML = this.wins.map(win => 
                        `<span data-source="${win.source}">${win.text}</span>`
                    ).join('');
                }
            }

            renderRentDayBanner() {
                const banner = document.getElementById('rent-day-banner');
                const today = new Date();
                const isRentDay = today.getDate() === 1;
                
                const tenantsOnClock = this.state.businesses?.filter(bay => {
                    const daysLeft = this.calculateDaysLeft(bay.business_pitch?.d30_checkpoint);
                    return daysLeft !== null && daysLeft <= 3;
                }).length || 0;

                if (isRentDay || tenantsOnClock > 0) {
                    banner.classList.remove('hidden');
                    document.getElementById('tenants-on-clock').textContent = tenantsOnClock;
                } else {
                    banner.classList.add('hidden');
                }
            }

            pulseBay(bayName) {
                const card = document.querySelector(`[data-bay-name="${bayName}"]`);
                if (card) {
                    card.classList.add('pulse-highlight');
                    setTimeout(() => card.classList.remove('pulse-highlight'), 1000);
                }
            }

            startPolling() {
                setInterval(() => {
                    this.loadData().then(() => this.render());
                }, 30000);
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            new YardCommand();
        });
    </script>
</body>
</html>
